const baseStudio=studio,baseFeedback=feedbackPanel,baseEvidence=evidence,baseHistory=history,baseInsights=insights,baseMatrixPanel=matrixPanel,baseForestPanel=forestPanel,baseTrajectoryPanel=trajectoryPanel,baseProgressPanel=progressPanel,baseDataPanel=dataPanel,baseModeStrip=modeStrip;
const isFlow=()=>!!P().flow;
function flowNext(){const p=P(),f=p.flow;if(p.kind==='personal'&&!p.draft.some(x=>x.text.trim()))return ['Write your first paragraph','寫下你的第一段','flow:personal-write'];if(!f.loaded||!p.draft.some(x=>x.text.trim()))return ['Load example draft','載入示範草稿','flow:load'];if(!f.confirmed||!p.sources.length)return p.kind==='personal'?['Add a research source','添加研究材料','add-source']:['Choose & confirm materials','選擇並確認材料','flow:materials'];if(p.kind==='personal')return ['Mark a claim in your draft','在稿件中標記主張','claim:0'];if(!f.run||f.run.outdated)return ['Check argument & evidence','檢查論證與證據','flow:analyse'];if(!p.comments.length)return ['Inspect analysis coverage','查看檢查範圍','flow:coverage'];if(!Object.keys(p.decisions).length)return ['Inspect the first comment','理解第一條回饋','focus:'+p.comments[0]?.id];return ['Revise your draft','自主修訂稿件','edit'];}
function flowBar(){const p=P(),f=p.flow,n=flowNext(),items=[[!!p.draft.some(x=>x.text.trim()),'Draft','草稿'],[f.confirmed,'Evidence','材料'],[!!f.run&&!f.run.outdated,'Feedback','回饋'],[!!Object.keys(p.decisions).length,'Judge','判斷'],[!!p.versions.length,'Revise','修訂']];return `<section class="flow-bar"><div class="flow-stepper">${items.map(([done,en,zh],i)=>`<span class="${done?'done':''}"><b>${done?'✓':i+1}</b>${L(en,zh)}</span>`).join('')}</div><div class="flow-next"><div><strong>${L('Next step','下一步')} · ${L(n[0],n[1])}</strong><p id="flow-status">${p.kind==='personal'?L('Write and connect your evidence manually. General AI analysis is not connected.','手動寫作並關聯證據；尚未接通任意文本 AI 分析。'):f.run?.outdated?L('Inputs changed. Earlier feedback is a historical snapshot; run the demo check again.','輸入已改變。舊回饋是歷史版本記錄，請重新進行示範檢查。'):L('You trigger each result. Demo feedback follows declared sample branches, not live AI.','每項結果由你觸發。回饋來自明確的案例分支，並非即時 AI。')}</p></div>${btn(n[0],n[1],n[2],'primary')}</div></section>`;}
modeStrip=function(){if(!isFlow())return baseModeStrip();return `<div class="mode-strip"><div class="mode-copy"><strong>${L('INTERACTIVE PROTOTYPE','互動示範版')}</strong>${P().kind==='personal'?L('Your writing · manual evidence tools','你的寫作 · 手動證據工具'):L('Guided case · your actions create the record','引導案例 · 操作生成你的記錄')}</div><div class="mode-tabs">${btn('Guided case','體驗案例','practice',P().kind==='practice'?'active':'')}${btn('My writing','我的寫作','personal',P().kind==='personal'?'active':'')}${btn('View worked example','查看完整答案','demo','')}${btn('Restart demo','重新開始示範','flow:restart','')}</div></div>`;};
overview=function(){if(demo())return `${head('WORKED EXAMPLE / REFERENCE','A complete example, for reference.','完整答案，供對照參考。',L('These answers and charts are prewritten. Use the guided case to trigger the workflow yourself.','這裏的答案和圖表是預寫參考。進入引導案例，親自觸發完整流程。'),btn('Experience the workflow','體驗操作流程','practice','primary'))}${baseModeStrip()}${metrics()}<div class="grid2">${forestPanel()}${trajectoryPanel()}</div><div class="grid2">${matrixPanel()}${progressPanel()}</div>`;
const p=P(),f=p.flow;return `<section class="welcome"><div class="eyebrow">ARGUPATH / ${L('ACADEMIC WRITING COACH','學術寫作輔導')}</div><span class="badge">${L('Interactive prototype · not live AI','互動示範版 · 非即時 AI')}</span><h1>${L('Ground your claims.<br>Strengthen your argument.','讓觀點有依據，<br>讓論證更清晰。')}</h1><p class="welcome-sub">${L('Bring a draft, literature and data. Examine the evidence, understand feedback and make your own revisions.','結合你的草稿、文獻與資料，梳理論證，理解回饋，在引導下完成自己的修訂。')}</p><div class="row">${btn(f.loaded?'Continue the guided case →':'Experience a writing case →',f.loaded?'繼續體驗寫作案例 →':'體驗一個完整寫作案例 →','practice','primary')}${btn('Start my writing','開始我的寫作','personal')}${f.loaded?btn('Start the demo from the beginning','從頭開始示範','flow:restart',''):''}</div>${f.loaded?`<p class="resume-note">${L('Your previous progress was restored automatically. Continue where you left off, or restart with a fresh case.','已自動恢復上次進度。你可以繼續上次，也可以從頭開始一個新案例。')}</p>`:''}<p class="welcome-audience">${L('For university students developing academic writing experience — especially senior undergraduates and novice postgraduate writers.','面向組織證據、解釋研究結果和形成論證經驗不足的大學生，重點服務高年級本科生與研究生初學者。')}</p></section><div class="journey-cards">${[['01','Bring your writing','放入你的草稿','Start with your own words and the sources behind them.','從自己的文字和所依據的材料開始。','pen'],['02','Examine the argument','理解論證回饋','Inspect a quoted sentence, its evidence and a relevant visual explanation.','檢查原句、證據及相關的可視化解釋。','book'],['03','Decide and revise','判斷並自主修訂','Accept, question or qualify the feedback; preserve your reasoning.','接受、質疑或部分接受回饋，留下自己的修改依據。','history']].map(([n,en,zh,e,z,i])=>`<section class="panel journey-card"><span>${n}</span>${icon(i)}<h2>${L(en,zh)}</h2><p>${L(e,z)}</p></section>`).join('')}</div><section class="case-invitation"><div><span class="eyebrow">${L('ONE CASE, A COMPLETE WORKFLOW','一個案例，一條完整路徑')}</span><h2>${L('Can the evidence support this conclusion?','這些證據，能支持這項結論嗎？')}</h2><p>${L('Explore a research-based discussion on social media and anxiety: six study materials, five connected paragraphs and decisions worth debating. You load the draft, confirm the evidence and request feedback.','用社交媒體與焦慮的學術寫作案例體驗：六份研究材料、五段連貫草稿，以及值得判斷的回饋。由你載入草稿、確認材料，再請求輔導。')}</p>${btn('View the walkthrough','查看體驗說明','guide','text-button')}</div><div class="case-output"><b>${L('What you will create','你將逐步生成')}</b><p>${L('Anchored comments · evidence charts · your decisions · a revised draft','原句批註 · 證據圖表 · 判斷記錄 · 修訂稿')}</p><small>${L('Synthetic teaching materials. Results stay hidden until you trigger the relevant action.','使用合成教學材料。相關結果在操作觸發後顯示。')}</small></div></section>${f.loaded?`<section class="section-gap">${metrics()}${btn('Return to my draft','返回我的稿件','view:studio','primary')}</section>`:''}<p class="footer-note">${L('Product focus: argument and evidence in academic writing. This case uses a discussion section; the product is not limited to that section.','產品聚焦學術寫作中的論證與證據。當前案例採用論文討論小節，不將產品永久限制於該章節。')}</p>`;};
studio=function(){if(!isFlow())return baseStudio();const p=P();if(!p.flow.loaded)return `${modeStrip()}${flowBar()}<div class="studio empty-studio"><div class="paper-wrap"><article class="paper"><div class="paper-kicker">${L('YOUR WRITING STARTS HERE','從你的寫作開始')}</div><h1>${L('A draft first.<br>Feedback follows.','先有你的草稿，<br>再有針對性的回饋。')}</h1><p>${L('Load the prepared 500–700 word academic draft. It contains contrasting findings, numerical interpretations and practical implications to examine. Nothing has been analysed yet.','載入已準備好的 500–700 詞學術草稿，其中涉及研究分歧、資料解釋與實踐含義。目前尚未進行分析。')}</p>${btn('Load example draft','載入示範草稿','flow:load','primary')}<div class="empty-paper-lines"></div></article></div><aside class="review-panel"><span class="badge">${L('AWAITING YOUR INPUT','等待你的輸入')}</span><h2>${L('What will happen next?','接下來會發生什麼？')}</h2><p>${L('1. Load the draft.<br>2. Confirm the source materials.<br>3. Request the demo analysis.<br>4. Inspect, decide and revise.','1. 載入草稿。<br>2. 確認研究材料。<br>3. 請求示範分析。<br>4. 理解、判斷並修訂。')}</p><p class="notice">${L('Graphs are generated from confirmed data and your actions, not placed here as finished results.','圖表由確認的資料與操作記錄生成，不預先擺放完成結果。')}</p></aside></div>`;
let html=baseStudio();html=html.replace('Literature synthesis & discussion','Academic writing workspace').replace('文獻綜合與討論','學術寫作工作台').replace('RESEARCH DISCUSSION / WORKING PAPER','ACADEMIC WRITING / YOUR DRAFT').replace('研究討論 / 工作稿','學術寫作 / 你的草稿');return `${modeStrip()}${flowBar()}${html}`;};
feedbackPanel=function(){if(!isFlow())return baseFeedback();const p=P(),f=p.flow;if(!f.run)return `<div class="feedback-empty"><span class="badge">${L('NO ANALYSIS YET','尚未分析')}</span><h3>${L('Your words come first.','從你的文字開始。')}</h3><p>${L('Confirm the materials, then request feedback on the draft. This prototype demonstrates selected case branches; it does not call an AI model.','確認材料後，再請求草稿回饋。此版本示範有限案例分支，不調用 AI 模型。')}</p>${btn(f.confirmed?'Check argument & evidence':'Choose materials',f.confirmed?'檢查論證與證據':'選擇材料',f.confirmed?'flow:analyse':'flow:materials','primary full-width')}</div>`;
const run=f.run,details=`<div class="run-summary"><strong>${esc(run.id)} · ${L('Demo check','示範檢查')}</strong><span>${p.comments.length} ${L('case comments','條案例回饋')}</span><p>${L('Exact sample branches, not open-ended text understanding. Unmatched text is unassessed, not approved.','按案例原句與材料匹配分支；未匹配文本尚未評估，不代表通過。')}</p>${btn('View analysis coverage','查看檢查範圍','flow:coverage','text-button')}</div>`;
if(!p.comments.length)return details+`<div class="warning">${L('No supported sample branch matched these inputs. Your text has not been judged correct. Use manual evidence links or compare the worked example.','當前輸入未匹配可用案例分支。系統未判斷文字正確；可手動關聯證據或對照完整示範。')}</div>${btn('Link evidence manually','手動關聯證據','claim:0','primary')}`;
let out=baseFeedback();out=out.replace('Authored teaching feedback, not live AI. One blanket causal-language suggestion is deliberately flawed; another remedy is overbroad.','Demo feedback is not authoritative. Check the design and evidence before deciding.').replace('預寫教學回饋，非即時 AI。包含一條故意錯誤的因果措辭建議，以及一項過度的修改建議。','示範回饋不是權威答案。請核對研究設計與證據，再作出自己的判斷。');
const current=p.comments.find(x=>x.id===focus)||p.comments[0],chart=current.id==='F4'?'change':['F2','F3','F5'].includes(current.id)?'effects':'coverage';out=out.replace('<p class="feedback-question">',`<div class="section-gap">${btn('Explain with evidence / data','用證據／資料解釋','flow:explain:'+chart,'primary full-width')}</div><p class="feedback-question">`);return details+out+`<div class="section-gap">${btn('Revise this paragraph →','修改這一段 →','flow:edit:'+current.p,'text-button full-width')}</div>`;};
function lockedChart(kind){const labels={effects:['Compare study estimates','比較研究估計'],change:['Compare the two groups','比較兩組變化'],coverage:['Build an evidence map','建立證據關係圖'],process:['Review my writing process','回顧本次寫作過程']},reasons={effects:L('Confirm at least one trial’s data, then generate a comparison.','確認至少一項試驗資料，再生成比較圖。'),change:L('Confirm S3, then use group changes to examine the treatment-effect sentence.','確認 S3，再用兩組變化檢查干預效果的表述。'),coverage:L('Identify claims in your text and confirm their evidence links.','從稿件識別主張，並確認與證據的關聯。'),process:L('Record a judgement or save a revision before creating your process chart.','記錄判斷或儲存修訂後，再生成過程圖。')};return `<section class="panel chart-empty"><span class="badge">${L('NOT GENERATED','尚未生成')}</span><h2>${L(...labels[kind])}</h2><p>${reasons[kind]}</p>${btn('Generate from my inputs','以目前資料建立圖表','flow:chart:'+kind,'primary')}<p class="notice">${L('A chart supports a writing decision. It is not a score.','圖表用於支持寫作判斷，不是能力得分。')}</p></section>`;}
forestPanel=function(){return isFlow()&&!P().flow.generated.includes('effects')?lockedChart('effects'):(P().sources.some(s=>s.editedData)?`<div class="chart-edited-wrap"><p class="warning">${L('Edited scenario inputs; source excerpts remain unchanged.','情境輸入已修改，材料原文不會更動。')}</p>${baseForestPanel()}</div>`:baseForestPanel());};
trajectoryPanel=function(){return isFlow()&&!P().flow.generated.includes('change')?lockedChart('change'):baseTrajectoryPanel();};
matrixPanel=function(){if(isFlow()&&!P().flow.generated.includes('coverage'))return lockedChart('coverage');return (isFlow()&&P().flow.mapRevision!==P().flow.revision&&P().flow.run?.outdated?`<div class="warning">${L('The draft or inputs changed. This map retains earlier links; review them against the current text.','稿件或輸入已改變。關係圖保留先前關聯，請對照當前文字重新覈查。')}</div>`:'')+baseMatrixPanel().replace('Authored starting map · inspect or revise in practice',L('Current evidence links · click to examine','當前證據關聯 · 點擊核對')).replace('預寫起始圖 · 可在練習中核對修改','當前證據關聯 · 點擊核對');};
progressPanel=function(){return isFlow()&&!P().flow.generated.includes('process')?lockedChart('process'):baseProgressPanel();};
dataPanel=function(){if(!isFlow())return baseDataPanel();return `<h3>${L('Visual explanations for your writing','服務於寫作的可視化解釋')}</h3><p>${L('Choose a question. The chart uses the sources you confirmed and records you created.','選擇要理解的問題。圖表使用你已確認的材料與實際產生的記錄。')}</p><div class="chart-actions">${btn('What do the trials estimate?','試驗結果能說明什麼？','flow:explain:effects')}${btn('Is a decline a treatment effect?','組內下降就是干預效果嗎？','flow:explain:change')}${btn('Which evidence supports my claims?','哪些證據支持我的主張？','flow:explain:coverage')}${btn('What have I judged and revised?','我判斷和修改了什麼？','flow:explain:process')}</div>`;};
evidence=function(){if(!isFlow())return baseEvidence();return `${head('INPUTS / EVIDENCE','The sources behind your writing.','為你的文字提供依據。',L('Confirm excerpts and data before requesting guidance.','先核對摘錄與資料，再請求輔導。'),btn(P().kind==='personal'?'Add material':'Choose / remove materials',P().kind==='personal'?'添加材料':'選擇／撤去材料',P().kind==='personal'?'add-source':'flow:materials','primary'))}${P().flow.confirmed?`<p class="notice">${L('Confirmed source selection. Changing it makes earlier feedback historical.','已確認材料選擇。修改後，舊回饋需重新核對。')}</p>`:''}${baseEvidence().replace(/^[\s\S]*?<div class="study-filter">/,'<div class="study-filter">')}`;};
insights=function(){if(!isFlow())return baseInsights();return `${head('WRITING / VISUAL EXPLANATIONS','See why a sentence needs attention.','看懂一句話為什麼需要修改。',L('Generate each chart from confirmed inputs. Return to the draft to use what you learn.','根據已確認輸入生成圖表，再回到稿件中應用。'),btn('Back to my draft','返回我的稿件','view:studio','primary'))}${modeStrip()}<div class="grid2">${forestPanel()}${trajectoryPanel()}</div><div class="grid2">${matrixPanel()}${progressPanel()}</div>${metrics()}<p class="footer-note">${L('Links, decisions and versions describe activity, not writing ability. Synthetic research values are not learner data.','關聯、判斷及版本表示操作記錄，不表示寫作能力。合成研究數值不屬於學習者資料。')}</p>`;};
history=function(){return baseHistory()+(isFlow()?`<section class="panel section-gap" style="padding:24px"><h2>${L('Earlier analysis snapshots','歷史分析版本記錄')}</h2>${P().flow.runs.map(a=>`<details><summary>${esc(a.run.id)} · ${Object.keys(a.decisions).length} ${L('decisions preserved','項判斷已保留')}</summary>${Object.entries(a.decisions).map(([id,d])=>`<p><b>${esc(id)} · ${esc(choices()[d.choice])}</b><br>${esc(d.reason)}</p>`).join('')||L('No decisions at that point.','當時尚無判斷。')}</details>`).join('')||`<p>${L('Rerunning the demo check preserves earlier decisions here.','重新示範檢查時，舊判斷會在此保留。')}</p>`}</section>`:'');};
guide=function(){modal('Experience the writing workflow','體驗完整寫作流程',`<p>${L('ArguPath focuses on argument and evidence in academic writing. This 10-minute case uses a paper’s discussion section; it is one use case, not the whole product.','ArguPath 聚焦學術寫作中的論證與證據。這條約 10 分鐘的案例採用論文討論小節，是一個使用場景，不是產品的全部範圍。')}</p><ol class="walkthrough"><li>${L('Load the draft. Read what the author is trying to argue.','載入草稿，理解作者想表達什麼。')}</li><li>${L('Choose all six materials. Open S3, check its excerpt and confirm the input data.','選擇六份材料，打開 S3 核對摘錄與輸入資料。')}</li><li>${L('Request the demo check. Click a highlighted sentence and inspect the quoted evidence.','觸發示範檢查，點擊高亮句核對證據。')}</li><li>${L('Use the data explanation for comment F4. Generate the group-change chart and compare both groups.','打開 F4 資料解釋，生成兩組變化圖。')}</li><li>${L('Judge F3 and F7. Is the feedback’s proposed remedy justified? Record your reasons.','判斷 F3 與 F7：建議的修改方式是否成立？記錄理由。')}</li><li>${L('Edit a paragraph, save your revision with a reason, and generate the process chart.','編輯段落，附理由儲存修訂，再生成過程圖。')}</li><li>${L('Try a branch: remove S3 and rerun; or edit a confirmed estimate and redraw its chart.','嘗試分支：撤去 S3 後重新檢查；或修改已確認估計，再生成圖表。')}</li></ol><div class="warning">${L('The current prototype uses exact sample branches, not open-ended AI analysis. No match means unassessed. Future model integration would replace extraction and analysis while retaining the evidence, chart and revision workflow.','當前版本使用案例原句分支，不是開放式 AI 分析。未匹配即未評估。未來接入模型將替換提取與分析環節，保留證據、圖表和修訂流程。')}</div>${btn('Experience the case','開始體驗','practice','primary')}`);};
function materialsDialog(){const p=P(),ids=p.sources.map(s=>s.id);modal('Choose and confirm research materials','選擇並確認研究材料',`<p>${L('Read the prepared excerpts and confirm which materials support this writing task. Selection is an input, not proof that the claim is correct.','閱讀準備好的摘錄，確認本次寫作使用哪些材料。選擇材料是輸入，不代表主張已被證實。')}</p><div class="materials-picker">${C.studies.map(s=>`<div class="material-choice"><label><input type="checkbox" name="flow-source" value="${s.id}" ${ids.includes(s.id)?'checked':''}><span><strong>${s.id} · ${esc(T(s.title))}</strong><small>${esc(T(s.design))} · n=${s.n}</small></span></label>${btn('Read excerpt','閱讀摘錄','flow:preview:'+s.id,'tiny-button')}</div>`).join('')}</div><div class="row section-gap">${btn('Select all six','選擇全部六份','flow:select-all','tiny-button')}${btn('Confirm selected materials','確認所選材料','flow:confirm','primary')}</div><p class="notice">${L('Synthetic teaching corpus. Extraction fields are supplied for inspection, not produced by a live model.','合成教學材料。提取欄位為預先準備、供核對的輸入，不是即時模型提取。')}</p>`);}
function estimateDialog(id){const s=P().sources.find(s=>s.id===id);if(!s||s.effect===undefined)return;modal('Confirm or correct the chart inputs','核對或糾正圖表輸入',`<span class="badge">${id} · ${L('SYNTHETIC DATA','合成資料')}</span><div class="source-excerpt section-gap">${esc(s.quote)}</div><p>${L('The excerpt is preserved. Edited numbers will be labelled as your scenario inputs and not attributed to the original excerpt.','材料原文不會更動。修改後的數值會標記為你調整的情境輸入，不歸於原始摘錄。')}</p>${[['effect','Mean difference','均值差'],['lo','Lower 95% limit','95% 區間下限'],['hi','Upper 95% limit','95% 區間上限']].map(([k,en,zh])=>`<label class="field-label" for="estimate-${k}">${L(en,zh)}</label><input id="estimate-${k}" class="field" type="number" step="0.1" value="${s[k]}">`).join('')}<label class="field-label" for="estimate-reason">${L('Why are you changing these inputs?','為什麼調整這些輸入？')}</label><textarea id="estimate-reason" class="field">${esc(s.dataReason||'')}</textarea><div class="row section-gap">${btn('Save inputs & redraw','儲存輸入並重新繪圖','flow:save-data:'+id,'primary')}${btn('Restore supplied values','恢復材料原值','flow:reset-data:'+id)}</div>`);}
function chartDialog(kind){const p=P(),names={effects:['Study estimates','研究結果與區間'],change:['Group changes','兩組時間變化'],coverage:['Claim–evidence map','主張與證據關係'],process:['My revision process','本次修訂過程']},content={effects:forest,change:lineChart,coverage:matrix,process:progressChart};modal(...names[kind],`<p class="notice">${L('Generated from this project’s confirmed inputs and records.','根據當前專案已確認輸入與記錄生成。')}</p>${content[kind]()}${kind==='effects'?`<div class="row">${p.sources.filter(s=>s.effect!==undefined).map(s=>btn('Inspect / edit '+s.id,'核對／修改 '+s.id,'flow:data:'+s.id,'tiny-button')).join('')}</div>${p.sources.some(s=>s.editedData)?`<div class="warning">${L('Edited scenario values differ from the source excerpts. Related feedback requires manual review.','情境數值已修改，與摘錄不同；相關回饋需人工複覈。')}</div>`:''}<p>${L('Shared units do not establish a shared intervention. No pooled effect or formal between-study comparison is calculated.','相同單位不代表相同干預。未計算合併效應，也未正式檢驗研究間差異。')}</p>`:kind==='change'?`<p>${L('Compare both groups: the intervention falls 2.6 points; the control falls 0.6. Their descriptive difference in changes is −2.0. The adjusted estimate is separately supplied by S3, not fitted from these means.','比較兩組：干預組下降 2.6 分，對照下降 0.6 分，描述性變化差為 −2.0。調整後估計另由 S3 提供，並非用這些均值擬合。')}</p><p class="notice">${L('Means ±1 SE; synthetic summary data, not individual observations.','均值 ±1 標準誤；合成彙總資料，非個體觀測。')}</p>`:kind==='coverage'?`<p>${L('These relations are proposed or manually recorded. Click a cell to inspect its reason; a coloured cell is not proof.','這些關係為案例提議或手動記錄。點擊單元格查看依據，顏色並不證明主張正確。')}</p>`:`<p>${L('Saved decisions and versions are process records, not evidence of mastery or correctness.','儲存判斷與版本是過程記錄，不是能力掌握或正確性的證明。')}</p>`}<div class="row section-gap">${btn('Return to my writing','返回我的寫作','flow:return','primary')}${btn('View chart collection','查看已生成圖表','view:insights','tiny-button')}</div>`);}
async function flowAction(a){const p=P();if(a==='flow:restart'){modal('Restart the demo','重新開始示範',`<p>${L('Start again with no loaded draft, selected materials, feedback or charts. Your earlier work stays in the project list; nothing is deleted.','從未載入草稿、未選擇材料、沒有回饋和圖表的狀態重新開始。之前的操作仍保留在專案列表中，不會刪除。')}</p><p class="notice">${L('Closing the browser saves your progress; it does not reset the demo.','關閉瀏覽器後仍會保留進度，不會重置示範。')}</p><div class="row section-gap">${btn('Start from the beginning','確認從頭開始','flow:new','primary')}${btn('Keep working','繼續當前進度','close')}</div>`);return true;}if(a==='flow:new'){const fresh=F.create(C);fresh.title+=' · Run '+(state.projects.filter(x=>x.kind==='practice').length+1);state.projects.push(fresh);state.active=state.projects.length-1;view='studio';focus='';paperMode='edit';save();$('dialog').close();render();window.scrollTo(0,0);return true;}if(a==='flow:personal-write'){view='studio';paperMode='edit';render();$('editor-0')?.focus();return true;}if(a==='flow:load'){F.load(C,p);paperMode='edit';view='studio';save();render();return true;}
if(a==='flow:materials'){materialsDialog();return true;}
if(a==='flow:select-all'){document.querySelectorAll('[name="flow-source"]').forEach(x=>x.checked=true);return true;}
if(a.startsWith('flow:preview:')){const checked=[...document.querySelectorAll('[name="flow-source"]:checked')].map(x=>x.value);p.flow.selectionDraft=checked;const s=C.studies.find(x=>x.id===a.split(':')[2]);modal('Read the teaching source','閱讀教學材料',sourceBody(s)+btn('Back to selection','返回材料選擇','flow:selection-back','primary section-gap'));return true;}
if(a==='flow:selection-back'){materialsDialog();document.querySelectorAll('[name="flow-source"]').forEach(x=>x.checked=(p.flow.selectionDraft||[]).includes(x.value));return true;}
if(a==='flow:confirm'){const ids=[...document.querySelectorAll('[name="flow-source"]:checked')].map(x=>x.value);try{F.confirm(C,p,ids);}catch(e){toast(L('Select at least one material.','請至少選擇一份材料。'));return true;}save();$('dialog').close();view='studio';render();toast(L('Sources confirmed. Request the demo check when ready.','材料已確認，可以請求示範檢查。'));return true;}
if(a==='flow:analyse'){try{const r=F.analyse(C,p);focus=p.comments[0]?.id||'';paperMode='annotated';reviewTab='feedback';view='studio';save();render();toast(L('Demo check complete: ','示範檢查完成：')+r.ids.length+L(' matched comments. See coverage for unassessed text.',' 條匹配回饋。未評估部分請查看檢查範圍。'));}catch(e){toast(e.message==='DRAFT_REQUIRED'?L('Write or load a draft first.','請先寫作或載入草稿。'):L('Confirm research materials first.','請先確認研究材料。'));}return true;}
if(a==='flow:coverage'){const r=p.flow.run;modal('What this check covered','本次檢查覆蓋了什麼',`<p>${L('This is a bounded sample-branch check, not a semantic assessment of the whole draft.','這是有限案例分支檢查，不是對全文的語義評估。')}</p><table class="data-table"><tr><th>${L('Status','狀態')}</th><th>${L('Comment IDs','批註編號')}</th></tr><tr><td>${L('Matched sample branches','已匹配案例分支')}</td><td>${esc(r.ids.join(', ')||'—')}</td></tr><tr><td>${L('Required material missing','缺少所需材料')}</td><td>${esc(r.missing.map(x=>x.id+' ('+x.sources.join(', ')+')').join('; ')||'—')}</td></tr><tr><td>${L('Original sentence not matched; unassessed','未匹配原句；尚未評估')}</td><td>${esc(r.unmatched.join(', ')||'—')}</td></tr><tr><td>${L('Data edited; manual review required','資料已改；需人工複覈')}</td><td>${esc(r.dataChanged.join(', ')||'—')}</td></tr></table><p>${L('Changing a sentence can remove an exact sample match. That does not establish that the revision is correct. Earlier decisions remain in revision review.','改寫句子可能不再匹配案例原句，但不代表改寫正確。歷史判斷保留在修訂回顧中。')}</p>${btn('Back to writing','返回寫作','flow:return','primary')}`);return true;}
if(a.startsWith('flow:edit:')){currentParagraph=+a.split(':')[2];paperMode='edit';view='studio';render();$('paragraph-'+currentParagraph)?.scrollIntoView({block:'start'});return true;}
if(a==='flow:return'){$('dialog').close();view='studio';render();$('paragraph-'+currentParagraph)?.scrollIntoView({block:'start'});return true;}
if(a.startsWith('flow:chart:')||a.startsWith('flow:explain:')){const kind=a.split(':')[2];if(kind==='coverage'&&!p.claims.length){if(p.kind==='personal'){toast(L('Mark a claim in your draft first.','請先在稿件中標記主張。'));return true;}modal('Identify claims and review the proposed links','識別主張並核對關聯提議',`<p>${L('Use the prepared claim candidates only for unchanged sample paragraphs. Edited paragraphs require manual claim marking. Each proposed relation includes a reason you can inspect and change.','僅對未改動的案例段落使用預備主張；改動後的段落需手動標記。每項關聯提議都有可核對和修改的理由。')}</p>${C.claims.map(c=>`<p><b>${esc(T(c.label))}</b> · ${L('Paragraph','段落')} ${c.paragraph+1}</p>`).join('')}${btn('Create the editable sample map','建立可編輯的案例關係圖','flow:map','primary')}`);return true;}try{F.generate(C,p,kind);save();if(a.startsWith('flow:explain:'))chartDialog(kind);else render();}catch(e){toast(({CONFIRM_TRIAL:L('Confirm S3 or S4 before generating this chart.','先確認 S3 或 S4 再生成該圖。'),NEED_S3:L('Select and confirm S3 first.','請先選擇並確認 S3。'),RECORD_REQUIRED:L('Record a judgement or save a revision first.','請先記錄判斷或儲存修訂。'),CLAIM_REQUIRED:L('Mark a claim first.','請先標記主張。')})[e.message]||e.message);}return true;}
if(a==='flow:map'){try{F.mapExample(C,p);F.generate(C,p,'coverage');save();chartDialog('coverage');}catch(e){toast(L('Run the demo check on your current inputs first.','請先對當前輸入執行示範檢查。'));}return true;}
if(a.startsWith('flow:data:')){estimateDialog(a.split(':')[2]);return true;}
if(a.startsWith('flow:save-data:')){const id=a.split(':')[2],values=['effect','lo','hi'].map(k=>$('estimate-'+k).value.trim()===''?NaN:Number($('estimate-'+k).value));try{F.editEstimate(p,id,values,$('estimate-reason').value);F.generate(C,p,'effects');save();chartDialog('effects');}catch(e){toast(L('Enter finite numbers with lower ≤ estimate ≤ upper, and explain the change.','請輸入有效數值，滿足下限 ≤ 估計 ≤ 上限，並說明修改理由。'));}return true;}
if(a.startsWith('flow:reset-data:')){const id=a.split(':')[2],s=p.sources.find(s=>s.id===id),original=C.studies.find(s=>s.id===id);Object.assign(s,C.clone(original));delete s.editedData;delete s.dataReason;F.invalidate(p,'data');F.generate(C,p,'effects');save();chartDialog('effects');return true;}
if(isFlow()&&(a==='forest-data'||a==='trajectory-data'||a.startsWith('trajectory:'))){const kind=a==='forest-data'?'effects':'change';try{F.generate(C,p,kind);save();chartDialog(kind);}catch(e){toast(L('Confirm the relevant materials first.','請先確認相關材料。'));}return true;}
if(isFlow()&&a==='commit-version'&&$('revision-reason')?.value.trim()){p.flow.generated=Array.from(new Set([...p.flow.generated,'process']));}
if(isFlow()&&a==='commit-source'&&['source-title','source-design','source-location','source-quote'].every(id=>$(id)?.value.trim())){p.flow.confirmed=true;F.invalidate(p,'materials');}
return false;}

const guidedSteps=[
 ['Load the draft','載入示範草稿','Start with the supplied discussion. No feedback has been generated yet.','先載入案例文章；這時還沒有任何分析結果。','flow:load'],
 ['Confirm the evidence','確認研究材料','Choose all six sources, then confirm your selection. You can open any excerpt first.','按「選取全部六份」，再按「確認所選材料」。也可以先閱讀摘錄。','flow:materials'],

function stepIndex(){const p=P(),f=p.flow;if(!f?.loaded)return 0;if(!f.confirmed)return 1;if(!f.run)return 2;if(!f.generated.includes('change'))return 3;if(!p.decisions.F4)return 4;if(!p.decisions.F3)return 5;if(!p.decisions.F1)return 6;if(!p.draft[0]?.text.includes(revisedSentence))return 7;if(!p.versions.length)return 8;if(!f.generated.includes('effects'))return 9;if(!f.generated.includes('coverage'))return 10;if(!p.mapInspected)return 11;if(!p.processSeen)return 12;if(!p.transfer.length)return 13;if(p.transfer.length<2)return 14;return 15;}
function guideCard(){if(!guided())return '';const n=stepIndex(),s=guidedSteps[n];return `<section class="v11-guide" aria-label="${L('Guided demonstration','引導示範')}"><div><span class="badge">${L('GUIDED DEMO · NO TYPING NEEDED','引導示範 · 無需打字')} · ${Math.min(n+1,16)} / 16</span><h2>${L(s[0],s[1])}</h2><p>${L(s[2],s[3])}</p><progress value="${n}" max="15" aria-label="${L('Demo progress','示範進度')}"></progress></div><div class="guide-buttons">${btn(L(s[0],s[1]),L(s[0],s[1]),s[4],'primary')}${btn('All steps','查看全部步驟','guide','tiny-button')}</div></section>`;}
const oldRender=render;
render=function(){oldRender();document.documentElement.lang=state.lang==='zh'?'zh-Hant':'en';const picker=$('project-picker');if(picker)picker.outerHTML=`<span class="badge">${guided()?L('Current demo','目前示範'):demo()?L('Worked example','完整示例'):L('My writing','我的寫作')}</span>${btn('History','歷史記錄','v11:history','tiny-button')}`;if(guided()){$('main').insertAdjacentHTML('afterbegin',guideCard());const st=guidedSteps[stepIndex()];$('app').insertAdjacentHTML('beforeend',`<div class="guide-dock">${btn('Next: '+st[0],'下一步：'+st[1],'v11:current','primary')}</div>`);}};
const oldFlowBar=flowBar;
flowBar=function(){return guided()?'':oldFlowBar();};
const oldFeedbackV11=feedbackPanel;

const oldTransferV11=transfer;
transfer=function(){let html=oldTransferV11();if(guided()){html=html.replace('<label class="field-label" for="transfer-answer">',`<div class="example-tools"><span class="badge">${L('DEMONSTRATION RESPONSE','示範作答')}</span><p>${L('Use a prepared response for presenting. Example responses are labelled and are not evidence of independent learning.','展示時可填入預備回答。這些記錄會標為示範作答，不代表獨立學習成果。')}</p><div class="row">${btn('Fill first example','填入示範初答','v11:transfer-first')}${P().transferHelp?btn('Fill revised example','填入示範修訂','v11:transfer-revised'):''}</div></div><label class="field-label" for="transfer-answer">`);html=html.replaceAll('Before in-app help','Before hints').replaceAll('After in-app help','After hints');P().transfer.forEach((a,i)=>{if(a.example)html=html.replace(`<summary>${i+1} · `,`<summary>${i+1} · ${L('Example response','示範作答')} · `);});}return html;};
const oldMatrixV11=matrix;
matrix=function(){return `<p class="notice">${L('Rows are claims; columns are sources. Click a labelled cell to read the evidence and the reason for the link. “Not linked” means no relationship has been recorded.','每列是一項主張，每欄是一份材料。按格子可閱讀證據及關聯理由。「尚未關聯」表示還沒有記錄關係。')}</p>`+oldMatrixV11().replaceAll("${a?a[0]:'·'}",'');};
function buildGuidedMap(){const p=P();if(!p.flow.confirmed){toast(L('Confirm sources first.','請先確認材料。'));return false;}const cs=C.clone(C.claims).filter(c=>p.draft[c.paragraph]?.text===C.draft[c.paragraph]?.text||(c.id==='C1'&&p.draft[0]?.text===C.draft[0].text.replace(originalSentence,revisedSentence)));
for(const c of cs){if(c.id==='C1'&&p.draft[0].text.includes(revisedSentence)){c.label=C.pair('No uniform harmful effect is established','現有證據未能確立一致的有害效果');c.relations={S1:'limit',S2:'support',S3:'limit',S4:'support',S5:'support',S6:'limit'};c.reasons={S1:'S1 shows an association for total time. It cannot establish a uniform causal effect across different forms of use.',S2:'The interval includes zero and positive associations. This supports caution about consistency, not a conclusion of no effect.',S3:'S3 supports a bounded programme effect; it does not establish a uniform effect of all social media use.',S4:'The interval is uncertain. This supports cautious wording about convergence, not proof of no effect.',S5:'Different estimates for passive and active use support distinguishing forms of use.',S6:'Qualitative accounts give context but cannot quantify a uniform causal effect.'};}for(const sid of Object.keys(c.relations))if(!p.sources.some(s=>s.id===sid)){delete c.relations[sid];delete c.reasons[sid];}}

window.addEventListener('resize',placeGuide);

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)Promise.resolve(action(b.dataset.act)).catch(err=>toast(L('Action unavailable; export a backup if needed. ','操作暫不可用，請按需匯出備份。')+err.message));});
document.addEventListener('keydown',e=>{const b=e.target.closest('svg [data-act]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();action(b.dataset.act);}});
document.addEventListener('input',e=>{const el=e.target,p=P();if(el.dataset.paragraph!==undefined&&!demo()){p.draft[+el.dataset.paragraph].text=el.value;F.invalidate(p,'draft');save();const status=$('flow-status');if(status)status.textContent=L('Draft changed. Previous feedback needs review; rerun the demo check when ready.','稿件已改變。歷史回饋需複覈；準備好後重新進行示範檢查。');}if(el.id==='decision-reason'){p.decisionDrafts??={};p.decisionDrafts[focus]={reason:el.value,choice:$('decision-choice').value};save();}if(el.id==='revision-reason'){p.revisionDraft=el.value;save();}if(el.id==='transfer-answer'){p.transferDraft=el.value;p.transferExample=false;save();}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='project-picker'){state.active=+el.value;focus='F1';view='overview';save();render();window.scrollTo(0,0);}if(el.id==='decision-choice'){P().decisionDrafts??={};P().decisionDrafts[focus]={reason:$('decision-reason').value,choice:el.value};save();}if(el.id==='import-file'&&el.files[0]){try{if(el.files[0].size>4000000)throw Error('FILE_TOO_LARGE');const b=JSON.parse(await el.files[0].text());if(![10,11].includes(b.version)||b.app!=='ArguPath')throw Error('INVALID_BACKUP_FORMAT');if(Array.isArray(b.project?.comments))b.project.comments=b.project.comments.map(x=>{const f=C.feedback.find(f=>f.id===x.id&&f.quote===x.quote);return f?C.clone(f):x;});const p=C.validate(b.project);F.validate(p);p.id=Date.now().toString(36);p.title+=' (imported)';state.projects.push(p);state.active=state.projects.length-1;save();$('dialog').close();view='overview';render();toast(L('Imported as a new project.','已匯入為新專案。'));}catch(err){toast(L('Import rejected. Existing work is unchanged. ','拒絕匯入，現有內容未改變。')+err.message);}}});
render();if(!storageFailed)save();
})();

</script></body></html>
