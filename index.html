'use strict';

const studies=[
{id:'S1',title:pair('Time online and anxiety symptoms','在線時長與焦慮症狀'),design:pair('Cross-sectional survey','橫斷面調查'),n:620,duration:pair('One measurement','一次測量'),measure:pair('Self-reported daily use; symptom scale 0–21','自報日使用時長；症狀量表 0–21'),result:'r = 0.24 [0.16, 0.32]',finding:pair('A positive association, with substantial individual variation.','正向關聯，且個體差異明顯。'),limit:pair('Convenience sample; simultaneous measurement; shared self-report method.','便利樣本；同時測量；共同自報方法。'),quote:'Among 620 students at two universities, self-reported daily social media time correlated with anxiety symptom scores (r = 0.24, 95% CI 0.16 to 0.32). Exposure and outcome were measured in the same survey. These estimates do not establish temporal order or eliminate unmeasured confounding.',role:pair('Association, not a causal test','關聯證據，不是因果檢驗'),section:'Results 2.1'},
{id:'S2',title:pair('Does use predict later symptoms?','使用是否預測後續症狀？'),design:pair('Three-wave longitudinal cohort','三波縱向隊列'),n:410,duration:pair('Six months','六個月'),measure:pair('Total daily use; baseline-adjusted symptoms','日總使用時長；控制基線症狀'),result:'β = 0.08 [−0.02, 0.18]',finding:pair('A small adjusted estimate with an interval crossing zero.','調整後估計較小，區間跨零。'),limit:pair('Attrition from 500 to 410; residual confounding; not proof of no effect.','500 人中 410 人完成；殘餘混雜；並非證明沒有效應。'),quote:'Of 500 enrolled students, 410 completed three waves over six months. The standardised coefficient for baseline daily use predicting later anxiety symptoms, adjusted for baseline symptoms, sleep and academic pressure, was 0.08 (95% CI −0.02 to 0.18). Attrition and unmeasured time-varying factors remain possible sources of bias.',role:pair('Temporal evidence with uncertainty','帶有不確定性的時間性證據'),section:'Results 3.2'},
{id:'S3',title:pair('A two-week usage-limit programme','兩週使用限制方案'),design:pair('Randomised controlled trial','隨機對照試驗'),n:120,duration:pair('14 days','14 天'),measure:pair('Symptom scale 0–21; lower is better','症狀量表 0–21；越低越好'),result:'MD = −2.0 [−3.2, −0.8]',finding:pair('Lower mean symptoms under the assigned programme.','分配到該方案的組平均症狀更低。'),limit:pair('Unblinded, short follow-up; duration rather than usage content changed; clinical importance not established.','未盲法、隨訪短；改變時長而非使用內容；臨牀重要性未確立。'),quote:'A total of 120 consenting students were randomly assigned equally to a two-week usage-limit programme or usual use. With reliable allocation, complete follow-up and consistent assessment assumed, the baseline-adjusted intervention-minus-control difference at day 14 was −2.0 symptom-scale points (95% CI −3.2 to −0.8). No threshold for clinical importance was specified. This estimates the effect of assignment to this programme in the sampled students.',role:pair('Bounded causal inference','有範圍限定的因果推斷'),section:'Results 4.1',effect:-2,lo:-3.2,hi:-.8},
{id:'S4',title:pair('A four-week notification intervention','四周通知管理干預'),design:pair('Randomised controlled trial','隨機對照試驗'),n:180,duration:pair('28 days','28 天'),measure:pair('Same symptom scale 0–21','相同症狀量表 0–21'),result:'MD = −0.4 [−1.1, 0.3]',finding:pair('A smaller estimate; the interval includes no difference.','估計較小；區間包含無差異。'),limit:pair('Different intervention and endpoint; uptake varied; estimates are not interchangeable with S3.','干預與終點時間不同；執行程度有差異；不能與 S3 互換。'),quote:'In 180 students randomised equally to notification management or usual settings for four weeks, the intention-to-treat adjusted mean difference was −0.4 points on the same 0–21 anxiety symptom scale (95% CI −1.1 to 0.3). Assessment was complete. Notification management is not the same exposure as a daily usage limit. The interval is compatible with some benefit, no difference and a small increase.',role:pair('Uncertainty and intervention heterogeneity','不確定性與干預異質性'),section:'Results 4.2',effect:-.4,lo:-1.1,hi:.3},
{id:'S5',title:pair('Passive browsing versus active connection','被動瀏覽與主動社交'),design:pair('Experience-sampling study','體驗抽樣研究'),n:96,duration:pair('21 days','21 天'),measure:pair('Within-person standardised associations','個體內標準化關聯'),result:'Passive β = 0.15; active β = −0.04',finding:pair('Associations differ by use type.','不同使用方式的關聯不同。'),limit:pair('Self-reported context; uncertain temporal ordering within the day; not an intervention.','情境自報；日內時間順序不明確；並非干預。'),quote:'Across 21 days in 96 students, within-person passive browsing was associated with higher same-day symptoms (standardised β = 0.15, 95% CI 0.07 to 0.23). Active connection had a smaller negative estimate (β = −0.04, 95% CI −0.11 to 0.03). Models adjusted for day-level workload. These observational coefficients do not establish that changing a usage type changes symptoms.',role:pair('A reason to disaggregate exposure','細分暴露變量的依據'),section:'Results 2.3'},
{id:'S6',title:pair('Why students stay connected','學生為何保持在線'),design:pair('Qualitative interviews','質性訪談'),n:24,duration:pair('One interview per participant','每人一次訪談'),measure:pair('Purposive sample; thematic analysis','目的抽樣；主題分析'),result:pair('Connection · comparison · study coordination','連接 · 比較 · 學習協調'),finding:pair('Participants describe both support and pressure.','參與者描述了支持與壓力兩面。'),limit:pair('Themes explain experiences, not population prevalence or causal effect sizes.','主題解釋體驗，不表示人羣發生率或因果效應量。'),quote:'Twenty-four purposively selected students described peer connection, social comparison and course coordination. Some used the same platforms for support and stressful comparison. The interviews offer contextual explanations and candidate mechanisms; theme counts were not designed to estimate population prevalence or intervention effectiveness.',role:pair('Context and possible mechanisms','情境與可能機制'),section:'Findings 3'}];
const draft=[
{title:pair('Overall interpretation','總體解釋'),text:'The relationship between social media use and university students’ anxiety has attracted considerable attention, yet the available evidence should be evaluated across research designs rather than treated as a single body of equivalent findings. This review considers six teaching studies that examine total exposure, targeted interventions and different forms of participation. The central question is whether greater social media use causes anxiety symptoms and what recommendations follow for universities. Across the six studies, social media use consistently increases anxiety. This apparent convergence provides a basis for considering whether institutions should prioritise reducing time online. However, the studies use different exposure definitions and follow-up periods, which need to be acknowledged when interpreting their findings.'},
{title:pair('Observational evidence','觀察性證據'),text:'The cross-sectional survey S1 found a positive correlation between self-reported daily use and symptom scores among 620 students, with r = 0.24 and a 95% confidence interval from 0.16 to 0.32. This result indicates a positive relationship within the sample but leaves temporal ordering unresolved. The longitudinal study S2 followed students over six months and adjusted for baseline symptoms, sleep and academic pressure. Its standardised estimate was 0.08, with a confidence interval from −0.02 to 0.18. The non-significant result in S2 proves that social media has no effect on anxiety. This makes S2 less useful when deciding whether to intervene, although the loss of 90 participants from the original cohort also complicates interpretation.'},
{title:pair('Intervention evidence','干預證據'),text:'Intervention evidence appears more directly relevant to recommendations. In S3, 120 students were randomly assigned to a two-week usage-limit programme or usual use. The adjusted mean difference at day 14 was −2.0 points, with a confidence interval from −3.2 to −0.8. Under the stated assumptions, S3 supports an average causal effect of assignment to this programme in this sample. The intervention group’s mean fell from 9.5 to 6.9, while the control group fell from 9.4 to 8.8. The 2.6-point fall in the intervention group is the treatment effect. S4 tested notification management for four weeks in 180 students and produced an adjusted difference of −0.4 points, with a confidence interval from −1.1 to 0.3. Because both trials report anxiety scores, their results can be treated as interchangeable estimates of the same intervention.'},
{title:pair('Mechanisms and context','機制與情境'),text:'The experience-sampling study S5 provides a more detailed account of daily use. Passive browsing was positively associated with same-day symptoms, whereas active connection had a small negative estimate with an interval crossing zero. These findings suggest that total time may obscure meaningful differences between activities, although the observational design does not establish what would happen if students changed those activities. Interviews in S6 similarly describe both support and pressure, including social comparison and the need to coordinate coursework. The interviews prove that social comparison mediates the effect. A mechanism-based account would therefore distinguish stressful comparison from purposeful interaction, while recognising that the same platform may support both practices and that students’ circumstances may shape their experiences.'},
{title:pair('Implications and research gap','研究含義與空缺'),text:'Taken together, the evidence suggests that a single measure of time online is insufficient to explain students’ experiences. Nevertheless, the positive cross-sectional association and the more favourable usage-limit trial offer a rationale for practical action. Universities should require all students to adopt the two-week limit. Such a recommendation would make support easier to communicate and could be evaluated through follow-up surveys. Future research should include larger samples and longer follow-up. It would also be useful to collect more detailed information about what students do online, compare changes in symptoms across settings and explore whether some students experience support while others encounter pressure. These steps could help connect the observed patterns with more precise intervention choices.'}];
const revised=[
{title:draft[0].title,text:'The six teaching studies suggest that the relationship between social media use and university students’ anxiety symptoms depends on how exposure is defined, how outcomes are measured and which design supports the inference. A positive cross-sectional association is present, but neither the longitudinal estimate nor the intervention results support a uniform effect across activities and settings. The evidence is therefore better synthesised around three questions: whether use precedes symptoms, whether assigned interventions change mean symptoms, and which forms of participation may help explain heterogeneous findings. This framing avoids treating a significant association, a trial contrast and an interview theme as equivalent answers to a single causal question.'},
{title:draft[1].title,text:'S1 identifies an association between total daily use and symptoms (r = 0.24, 95% CI 0.16 to 0.32), but simultaneous self-report leaves reverse direction, common-method effects and confounding unresolved. S2 improves temporal ordering and adjusts for measured baseline characteristics. Its standardised coefficient of 0.08 (95% CI −0.02 to 0.18), however, remains compatible with a small negative association, no association or a positive one. It should not be interpreted as proof of no effect. Attrition from 500 to 410 students further raises questions about who remained in the cohort. The different estimands also matter: a cross-sectional correlation and an adjusted longitudinal coefficient should not be averaged or compared as if they were the same quantity.'},
{title:draft[2].title,text:'The trials provide more direct but intervention-specific evidence. Under the stated assumptions about allocation, follow-up and assessment, S3 supports an average causal effect of assignment to the two-week usage-limit programme in this sample. Its adjusted intervention-minus-control difference was −2.0 points (95% CI −3.2 to −0.8). The intervention group’s 2.6-point decline alone is not the treatment contrast, because the control group also declined by 0.6 points. The descriptive difference in changes is −2.0 points; the adjusted estimate and interval should be reported as the study’s inferential result. S4 concerns notification management at four weeks, with a smaller estimate of −0.4 points (95% CI −1.1 to 0.3). A shared symptom scale permits a visual comparison of units, but different interventions and endpoints prevent these studies from being treated as interchangeable replications. Neither study specifies a threshold that would establish clinical importance.'},
{title:draft[3].title,text:'S5 and S6 help refine the interpretation rather than resolve causality. S5 differentiates passive browsing from active connection within individuals, suggesting that total exposure may hide contrasting patterns. Its same-day observational estimates still leave temporal order and contextual confounding uncertain. S6 supplies accounts of comparison, support and course coordination that can inform candidate mechanisms and intervention acceptability. Those interview themes do not demonstrate statistical mediation or establish how common each experience is in the population. Together, these studies justify a more differentiated account of use, while leaving open whether changing specific practices would alter symptoms and for whom.'},
{title:draft[4].title,text:'A universal restriction is consequently not established by this evidence. A voluntary, monitored pilot could be proposed for evaluation, with clear outcomes and attention to unintended losses of peer or academic support. This is a proposal requiring further evidence, not an already proven policy. A focused research gap is whether interventions targeting passive comparison, rather than total time alone, produce sustained symptom changes without reducing beneficial connection. A subsequent study could compare a targeted strategy, a general usage limit and usual use, measure adherence and support, and follow students beyond the initial intervention. Prespecified subgroup questions would require adequate precision. This agenda follows from the observed differences in exposure and design, rather than the generic claim that larger studies are always needed.'}];

{id:'F1',p:0,quote:'Across the six studies, social media use consistently increases anxiety.',title:pair('Synthesis flattens disagreement','綜合結論掩蓋了分歧'),type:pair('Evidence synthesis','證據綜合'),sources:['S1','S2','S4','S5'],explain:pair('The studies differ in exposure, design and uncertainty. A consistent harmful effect is not supported by all six.','研究的暴露變量、設計與不確定性不同，六份材料不能共同支持一致有害效果。'),question:pair('Which result most challenges the word “consistently”?','哪項結果最挑戰“一致”這一表述？'),hints:[pair('Compare the intervals and exposure definitions, not only the direction of point estimates.','比較區間和暴露定義，而非僅比較點估計方向。'),pair('S2 and S4 include zero; S5 separates passive and active use. Organise the synthesis by these differences.','S2、S4 區間包含零，S5 區分主動與被動使用，可據此組織綜合。')],choice:'accept',reason:'I accept this comment because the cohort and notification trial are uncertain, and S5 distinguishes forms of use. I will organise the synthesis around design and exposure rather than claim uniform harm.'},
{id:'F2',p:1,quote:'The non-significant result in S2 proves that social media has no effect on anxiety.',title:pair('Absence of significance is not proof of absence','不顯著不等於證明無效應'),type:pair('Uncertainty','不確定性'),sources:['S2'],explain:pair('The interval −0.02 to 0.18 includes both zero and positive coefficients. No equivalence margin or test is supplied.','區間包含零及正向係數，材料也未提供等效界限或等效檢驗。'),question:pair('What range of interpretations remains compatible with the estimate?','這一估計仍與哪些解釋相容？'),hints:[pair('Read both endpoints of the interval.','查看區間的兩個端點。'),pair('Distinguish “not established” from “ruled out”; consider attrition and precision.','區分尚未確立與已經排除，並考慮流失與精度。')],choice:'accept',reason:'The interval includes a range of effects and no equivalence test was reported. I will describe uncertainty rather than claim a proven null effect.'},
{id:'F3',p:2,quote:'Under the stated assumptions, S3 supports an average causal effect of assignment to this programme in this sample.',title:pair('Should every causal claim be weakened?','所有因果結論都應改弱嗎？'),type:pair('Feedback judgement','回饋判斷'),sources:['S3'],explain:pair('Teaching suggestion to evaluate: replace “causal effect” with “association”, because academic writing should always avoid causal language.','待判斷的教學建議：將因果效果改為關聯，因為學術寫作應該總是避免因果語言。'),question:pair('Does this suggestion respect the design and boundaries already stated?','此建議是否尊重研究設計與句中已有的限定？'),hints:[pair('Inspect random assignment and what the trial actually assigned.','核對隨機分配與實際分配的干預。'),pair('A bounded effect of assignment may be justified under the assumptions; total use and universal effects are different claims.','給定假設下，限定範圍的分配效果可能成立；總使用量與普遍效果是其他主張。')],choice:'challenge',reason:'I challenge the blanket rule. S3 is a randomised comparison and the sentence explicitly limits the inference to assignment, assumptions and sample. I will retain this bounded causal statement.'},
{id:'F4',p:2,quote:'The 2.6-point fall in the intervention group is the treatment effect.',title:pair('Use the comparison, not only the decline','使用組間對照，不能只看下降'),type:pair('Data interpretation','資料解釋'),sources:['S3'],explain:pair('The control mean also fell by 0.6. The descriptive difference in changes is −2.0; the study reports an adjusted difference and its interval.','對照均值也下降 0.6。描述性變化差是 −2.0；研究另報告調整後差異及區間。'),question:pair('What would the within-group decline include besides treatment?','組內下降除干預外，還可能包含什麼？'),hints:[pair('Calculate the change for each group separately.','先分別計算兩組變化。'),pair('Subtract control change from intervention change. Distinguish this descriptive calculation from the adjusted inferential estimate.','用干預變化減對照變化，區分描述計算與調整後推斷估計。')],choice:'accept',reason:'The control group changed too. I will use the adjusted between-group estimate, and show the difference in changes only as a descriptive illustration.'},
{id:'F5',p:2,quote:'Because both trials report anxiety scores, their results can be treated as interchangeable estimates of the same intervention.',title:pair('Shared units do not mean a shared intervention','單位相同不代表干預相同'),type:pair('Comparability','可比性'),sources:['S3','S4'],explain:pair('Both trials use the same scale but differ in intervention and endpoint. The chart is a comparison, not a meta-analysis.','兩試驗量表相同，但干預與時間終點不同；圖表是對照展示，不是元分析。'),question:pair('What is being estimated in each trial?','兩項試驗各自在估計什麼？'),hints:[pair('Compare programme components and timing.','比較方案組成與時間。'),pair('State why units are visually comparable while keeping each estimand distinct; do not infer a significant between-study difference from these intervals.','可比較單位，但應保留估計目標差異，也不能據區間直接斷定研究間差異顯著。')],choice:'accept',reason:'I will compare the estimates in common units but not pool them: usage restriction at day 14 and notification management at day 28 are different interventions and endpoints.'},
{id:'F6',p:3,quote:'The interviews prove that social comparison mediates the effect.',title:pair('A plausible mechanism is not demonstrated mediation','合理機制並非已證實的中介'),type:pair('Mechanism','機制解釋'),sources:['S5','S6'],explain:pair('Interview accounts can propose mechanisms and explain context. They do not estimate a causal mediation effect.','訪談能提出機制與解釋情境，但不估計因果中介效應。'),question:pair('What can interview accounts contribute without claiming proof?','不宣稱證明時，訪談仍能提供什麼？'),hints:[pair('Separate experience, hypothesis and tested causal pathway.','區分體驗、假設與已檢驗的因果路徑。'),pair('Use S6 to motivate a mechanism for future testing, and avoid prevalence claims from theme counts.','用 S6 提出待檢驗機制，不從主題次數推斷人羣發生率。')],choice:'accept',reason:'I will use the interviews as contextual and hypothesis-generating evidence rather than as proof of mediation.'},
{id:'F7',p:4,quote:'Universities should require all students to adopt the two-week limit.',title:pair('Does the policy follow from these studies?','政策是否由這些研究推出？'),type:pair('Scope & implications','範圍與含義'),sources:['S3','S4','S6'],explain:pair('The universal requirement exceeds the evidence. Teaching suggestion: delete every practical recommendation from the discussion.','普遍強制要求超出證據。待判斷的教學建議：刪除討論中的所有實踐建議。'),question:pair('Can you reject the universal policy while retaining a proposal requiring evaluation?','能否撤回普遍政策，同時保留需評估的提議？'),hints:[pair('Distinguish an established recommendation from a proposed pilot.','區分已確立建議與試點提議。'),pair('Consider voluntary participation, unintended losses of support and outcomes to evaluate.','考慮自願參與、支持的意外損失，以及需評估的結果。')],choice:'partial',reason:'I accept the concern about a universal mandate, but not the demand to remove all implications. I will propose a voluntary monitored pilot requiring evaluation.'},
{id:'F8',p:4,quote:'Future research should include larger samples and longer follow-up.',title:pair('Turn a generic limitation into a researchable gap','把泛泛侷限轉化為可研究空缺'),type:pair('Research gap','研究空缺'),sources:['S3','S4','S5','S6'],explain:pair('This is plausible but does not yet explain what unresolved comparison matters or why.','建議可能合理，但尚未說明重要的未解決比較是什麼，以及為什麼。'),question:pair('Which difference between these studies motivates the next study?','研究間哪項差異能推動下一項研究？'),hints:[pair('Compare total time, notification management and type of participation.','比較總時長、通知管理與參與方式。'),pair('Specify a target strategy, comparison, duration and outcome, including loss of beneficial connection.','具體說明目標策略、對照、時間與結果，也關注有益連接的損失。')],choice:'accept',reason:'I will propose a focused comparison of targeted passive-use strategies versus total-time restriction, including sustained symptoms and beneficial connection.'}];
const trajectory={days:[0,7,14],groups:[{id:'intervention',label:pair('Usage-limit programme','使用限制組'),values:[9.5,7.9,6.9],se:[.45,.43,.42]},{id:'control',label:pair('Usual use','通常使用組'),values:[9.4,9.1,8.8],se:[.44,.45,.44]}]};
function seed(kind='demo'){const isDemo=kind==='demo';return {id:Date.now().toString(36)+Math.random().toString(36).slice(2),kind,title:kind==='personal'?'My research discussion':'Social media & anxiety',draft:clone(kind==='personal'?[{title:pair('Discussion','討論'),text:''}]:draft),sources:clone(kind==='personal'?[]:studies),claims:clone(kind==='personal'?[]:claims),comments:clone(kind==='personal'?[]:feedback),decisions:isDemo?Object.fromEntries(feedback.map(f=>[f.id,{choice:f.choice,reason:f.reason}])):{},hints:{},versions:[],transfer:[],transferHelp:false,notes:'',createdAt:new Date().toISOString()};}
function textOf(ps){return ps.map(p=>p.text).join('\n\n');}
function stale(project,f){return project.draft[f.p]?.text!==draft[f.p]?.text;}
function stats(p){const fs=p.comments;return {sources:p.sources.length,claims:p.claims.length,linked:p.claims.filter(c=>Object.keys(c.relations).length).length,pending:fs.filter(f=>!p.decisions[f.id]).length,decided:fs.filter(f=>p.decisions[f.id]).length,stale:fs.filter(f=>stale(p,f)).length,versions:p.versions.length,words:(textOf(p.draft).match(/\b[\w]+(?:[-’'][\w]+)*\b/g)||[]).length};}
function saveVersion(p,reason){if(!reason.trim())throw Error('REASON_REQUIRED');const last=p.versions.at(-1);if(last&&last.text===textOf(p.draft)&&last.reason===reason.trim())return last;const v={id:'V'+(p.versions.length+1),text:textOf(p.draft),paragraphs:clone(p.draft),reason:reason.trim(),decisions:clone(p.decisions),relations:clone(p.claims),createdAt:new Date().toISOString()};p.versions.push(v);return v;}
function validate(p){if(!p||!['demo','practice','personal'].includes(p.kind)||!Array.isArray(p.draft)||p.draft.length>100||!p.draft.every(x=>typeof x.text==='string'&&x.text.length<100000&&typeof x.title?.en==='string'&&typeof x.title?.zh==='string'))throw Error('INVALID_BACKUP');if(!Array.isArray(p.sources)||p.sources.length>100||!p.sources.every(s=>typeof s.id==='string'&&/^[A-Za-z0-9_-]+$/.test(s.id)&&typeof s.quote==='string'&&typeof s.title?.en==='string'&&typeof s.title?.zh==='string'&&typeof s.design?.en==='string'&&typeof s.design?.zh==='string'))throw Error('INVALID_BACKUP');if(!Array.isArray(p.claims)||!p.claims.every(c=>typeof c.id==='string'&&/^[A-Za-z0-9_-]+$/.test(c.id)&&typeof c.label?.en==='string'&&typeof c.label?.zh==='string'&&c.relations&&Object.values(c.relations).every(r=>['support','limit','counter'].includes(r))))throw Error('INVALID_BACKUP');if(!Array.isArray(p.comments)||!p.comments.every(f=>feedback.some(x=>JSON.stringify(x)===JSON.stringify(f))))throw Error('INVALID_BACKUP');if(!p.decisions||Object.values(p.decisions).some(d=>!['accept','partial','challenge','defer'].includes(d.choice)||typeof d.reason!=='string')||!p.hints||Object.values(p.hints).some(h=>!Array.isArray(h)||h.some(n=>![1,2].includes(n)))||!Array.isArray(p.versions)||!p.versions.every(v=>typeof v.text==='string'&&typeof v.reason==='string'&&Array.isArray(v.paragraphs)&&v.decisions)||!Array.isArray(p.transfer))throw Error('INVALID_BACKUP');return p;}

(function(root,factory){if(typeof module==='object')module.exports=factory();else root.APFlow=factory();})(typeof globalThis!=='undefined'?globalThis:this,function(){
'use strict';
const copy=x=>JSON.parse(JSON.stringify(x));
function create(C,kind='practice'){const p=C.seed(kind);p.draft=kind==='personal'?p.draft:[];p.sources=[];p.claims=[];p.comments=[];p.decisions={};p.flow={loaded:kind==='personal',confirmed:false,generated:[],runs:[],revision:0,trajectory:copy(C.trajectory)};return p;}
function invalidate(p,reason){if(!p.flow)return;p.flow.revision++;p.flow.changed=reason;if(p.flow.run)p.flow.run.outdated=true;if(reason==='materials'||reason==='data')p.flow.generated=p.flow.generated.filter(x=>x!=='effects'&&x!=='change');}
function load(C,p){if(p.flow.loaded)return;p.draft=copy(C.draft);p.flow.loaded=true;p.flow.baseline=copy(p.draft);invalidate(p,'draft');}
function confirm(C,p,ids){if(!Array.isArray(ids)||!ids.length)throw Error('MATERIALS_REQUIRED');const existing=p.sources;p.sources=ids.map(id=>existing.find(s=>s.id===id)||C.studies.find(s=>s.id===id)).filter(Boolean).map(copy);if(!p.sources.length)throw Error('MATERIALS_REQUIRED');p.flow.confirmed=true;for(const c of p.claims){for(const sid of Object.keys(c.relations))if(!ids.includes(sid)){delete c.relations[sid];if(c.reasons)delete c.reasons[sid];}}invalidate(p,'materials');}
function analyse(C,p){if(!p.draft.some(x=>x.text.trim()))throw Error('DRAFT_REQUIRED');if(!p.flow.confirmed||!p.sources.length)throw Error('MATERIALS_REQUIRED');if(p.kind==='personal')throw Error('MANUAL_ONLY');if(p.flow.run&&!p.flow.run.outdated)return p.flow.run;
if(p.flow.run)p.flow.runs.push({run:copy(p.flow.run),comments:copy(p.comments),decisions:copy(p.decisions),hints:copy(p.hints)});
const missing=[],unmatched=[],dataChanged=[],eligible=[];
for(const f of C.feedback){if(!p.draft[f.p]?.text.includes(f.quote)){unmatched.push(f.id);continue;}const absent=f.sources.filter(id=>!p.sources.some(s=>s.id===id));if(absent.length){missing.push({id:f.id,sources:absent});continue;}if(f.sources.some(id=>p.sources.find(s=>s.id===id)?.editedData)){dataChanged.push(f.id);continue;}eligible.push(copy(f));}
p.comments=eligible;p.decisions={};p.decisionDrafts={};p.hints={};const run={id:'R'+(p.flow.runs.length+1),at:new Date().toISOString(),revision:p.flow.revision,paragraphs:copy(p.draft),sources:copy(p.sources),missing,unmatched,dataChanged,ids:eligible.map(f=>f.id),outdated:false};p.flow.run=run;return run;}
function editEstimate(p,id,values,reason){const s=p.sources.find(s=>s.id===id);if(!s||s.effect===undefined||values.some(x=>!Number.isFinite(x))||values[1]>values[0]||values[0]>values[2]||!reason.trim())throw Error('INVALID_ESTIMATE');[s.effect,s.lo,s.hi]=values;s.result=`MD = ${s.effect} [${s.lo}, ${s.hi}]`;s.editedData=true;s.dataReason=reason.trim();invalidate(p,'data');}
function generate(C,p,kind){if(!['effects','change','coverage','process'].includes(kind))throw Error('UNKNOWN_CHART');if(kind==='effects'&&(!p.flow.confirmed||!p.sources.some(s=>s.effect!==undefined)))throw Error('CONFIRM_TRIAL');if(kind==='change'&&(!p.flow.confirmed||!p.sources.some(s=>s.id==='S3')))throw Error('NEED_S3');if(kind==='coverage'&&!p.claims.length)throw Error('CLAIM_REQUIRED');if(kind==='process'&&!Object.keys(p.decisions).length&&!p.versions.length)throw Error('RECORD_REQUIRED');if(!p.flow.generated.includes(kind))p.flow.generated.push(kind);}
function mapExample(C,p){if(!p.flow.run||p.flow.run.outdated)throw Error('ANALYSIS_REQUIRED');p.claims=copy(C.claims.filter(c=>p.draft[c.paragraph]?.text===C.draft[c.paragraph]?.text));for(const c of p.claims){for(const sid of Object.keys(c.relations))if(!p.sources.some(s=>s.id===sid)){delete c.relations[sid];delete c.reasons[sid];}}return p.claims;}
function validate(p){if(!p.flow)return p;const f=p.flow;if(!Array.isArray(f.generated)||f.generated.some(x=>!['effects','change','coverage','process'].includes(x))||!Array.isArray(f.runs)||!Number.isFinite(f.revision)||typeof f.loaded!=='boolean'||typeof f.confirmed!=='boolean')throw Error('INVALID_FLOW');return p;}
return {create,invalidate,load,confirm,analyse,editEstimate,generate,mapExample,validate};
});

function render(){document.documentElement.lang=state.lang==='zh'?'zh-Hant':'en';const navs=[['overview','Start writing','開始寫作','grid'],['studio','Writing studio','寫作工作台','pen'],['evidence','Evidence library','研究材料','book'],['insights','Evidence & data','圖表與資料','chart'],['history','Revision review','修訂回顧','history'],['transfer','Transfer practice','換個題目試試','layers']];$('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">A</div>ArguPath<span>.</span></div><div class="brand-sub">ACADEMIC WRITING COACH</div><div class="caption">${L('WORKSPACE','工作空間')}</div><nav>${navs.map(([id,en,zh,i])=>`<button class="nav ${view===id?'active':''}" data-act="view:${id}" aria-label="${L(en,zh)}" ${view===id?'aria-current="page"':''}>${icon(i)}<span>${L(en,zh)}</span></button>`).join('')}</nav>${view==='studio'?`<div class="caption">${L('YOUR MANUSCRIPT','你的稿件')}</div>${isFlow()?`<div class="sidebar-task">${btn('Writing task','本次寫作任務','brief','text-button')}${btn(P().sources.length+' materials · manage',P().sources.length+' 份材料 · 管理',P().kind==='personal'?'add-source':'flow:materials','text-button')}<div class="source-chips">${P().sources.map(s=>btn(s.id,s.id,'source:'+s.id,'tiny-button')).join('')}</div></div>`:''}${P().draft.map((p,i)=>`<button class="outline-link ${i===currentParagraph?'active':''}" data-act="paragraph:${i}">${String(i+1).padStart(2,'0')} · ${esc(T(p.title))}</button>`).join('')}`:`<div class="side-box"><span class="badge">${L('GUIDED RESEARCH CASE','研究寫作案例')}</span><p style="margin-top:12px">${L('Read the evidence.<br>Question the inference.<br>Own the revision.','閱讀證據。<br>檢查推斷。<br>自主修訂。')}</p>${btn('Explore the walkthrough','查看完整劇本','guide','text-button')}</div>`}<div class="side-bottom">${btn('Project & backup','專案與備份','settings','text-button')}<p>ArguPath<br>${L('Your words. Your judgement.','你的文字，你的判斷。')}</p></div></aside><div class="main"><header class="topbar"><div class="top-title"><span class="breadcrumb">${L('Academic writing /','學術寫作 /')}</span>${L('Argument & evidence','論證與證據')}</div><div class="top-right"><select class="project-picker" id="project-picker" aria-label="${L('Select project','選擇專案')}">${state.projects.map((p,i)=>`<option value="${i}" ${i===state.active?'selected':''}>${p.kind==='demo'?L('Complete example','完整示範'):p.kind==='practice'?L('Practice','練習'):L('Personal','個人')} · ${esc(p.title)}</option>`).join('')}</select><span class="save" id="save-label">${storageFailed?L('Export to keep work','請匯出以保留'):L('Saved locally','已儲存在此裝置')}</span><div class="language">${btn('English','English','lang:en',state.lang==='en'?'active':'')}${btn('繁體中文','繁體中文','lang:zh',state.lang==='zh'?'active':'')}</div>${btn('Restart demo','重新開始示範','flow:restart','tiny-button restart-demo')}${btn('Project','專案','settings','tiny-button')}${btn('Export','匯出','export','tiny-button')}<span class="avatar">AP</span></div></header><main id="main" class="page ${view==='studio'?'work-page':''}">${view==='overview'?overview():view==='studio'?studio():view==='evidence'?evidence():view==='insights'?insights():view==='history'?history():transfer()}</main></div></div>`;}
function head(ey,en,zh,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${ey}</div><h1>${L(en,zh)}</h1><p class="subtitle">${sub}</p></div>${action}</div>`;}
function panel(en,zh,sub,body,tag,foot){return `<section class="panel"><div class="panel-head"><div><h2>${L(en,zh)}</h2><p>${sub}</p></div><span class="badge gray">${tag}</span></div><div class="panel-body">${body}<div class="chart-foot">${foot}</div></div></section>`;}
function metrics(){const s=C.stats(P());return `<div class="metrics">${[[s.sources,'Research materials','研究材料',L('Different designs, one question','不同研究設計，同一問題'),'book','view:evidence'],[s.linked+'/'+s.claims,'Claims with evidence links','已關聯材料的主張',L('Links do not certify support','關聯不代表已證實'),'layers','view:insights'],[s.pending,'Decisions still open','待記錄的判斷',demo()?L('Prewritten example has 8 decisions','預寫示例已有 8 條判斷'):L('Click to inspect the comments','點擊查看具體批註'),'pen','view:studio'],[demo()?2:s.versions,'Saved draft versions','稿件版本',demo()?L('Initial → revised · illustrative','初稿 → 修訂稿 · 示範'):L('Saved with your revision reasons','附有你的修訂理由'),'history','view:history']].map(([v,en,zh,n,i,a])=>`<button class="metric" data-act="${a}"><div class="metric-top">${L(en,zh)}${icon(i)}</div><div class="value">${v}</div><small>${n}</small></button>`).join('')}</div>`;}
function forest(){const trials=P().sources.filter(s=>s.effect!==undefined);if(!trials.length)return `<p>${L('No confirmed comparable estimates.','沒有已確認的可比估計。')}</p>`;const lo=Math.min(-4,...trials.map(s=>Math.floor(s.lo))),hi=Math.max(1,...trials.map(s=>Math.ceil(s.hi))),ticks=Array.from({length:6},(_,i)=>lo+i*(hi-lo)/5),x=v=>165+(v-lo)/(hi-lo)*300;return `<svg class="chart" viewBox="0 0 520 210" role="img" aria-label="${L('Two synthetic trial mean differences with 95 percent confidence intervals','兩項合成試驗均值差與百分之九十五置信區間')}"><title>${trials.map(s=>`${s.id}: ${s.effect} [${s.lo}, ${s.hi}]`).join("; ")}. Confirmed teaching inputs; no pooled effect.</title>${ticks.map(v=>`<line x1="${x(v)}" x2="${x(v)}" y1="33" y2="154" class="${v===0?'focus-line':'grid-line'}"/><text x="${x(v)}" y="176" text-anchor="middle">${Number(v.toFixed(1))}</text>`).join('')}${P().sources.filter(s=>s.effect!==undefined).map((s,i)=>{const y=66+i*66;return `<g data-act="source:${s.id}" tabindex="0" role="button" aria-label="${s.id} ${esc(T(s.title))}"><text x="2" y="${y-7}" class="chart-num">${s.id} · ${s.id==='S3'?L('Usage limit','使用限制'):L('Notifications','通知管理')}</text><text x="2" y="${y+10}">n=${s.n} · ${T(s.duration)}</text><line x1="${x(s.lo)}" x2="${x(s.hi)}" y1="${y}" y2="${y}" stroke="${i?'#9c85c5':'#7250c5'}" stroke-width="3"/><path d="M${x(s.lo)} ${y-5}v10 M${x(s.hi)} ${y-5}v10" stroke="#9277b7"/><rect x="${x(s.effect)-5}" y="${y-5}" width="10" height="10" fill="${i?'#b6a3d1':'#7450c4'}"/><text x="${x(s.effect)}" y="${y-17}" text-anchor="middle" class="chart-num">${s.effect.toFixed(1)} [${s.lo.toFixed(1)}, ${s.hi.toFixed(1)}]</text></g>`}).join('')}<text x="300" y="201" text-anchor="middle">${L('Adjusted mean difference · symptom-scale points','調整後均值差 · 症狀量表分數')}</text></svg>`;}
function lineChart(){const x=i=>65+i*195,y=v=>210-v*7;const colors=['#7650c7','#48a394'];return `<div class="legend"><span><i class="dot"></i>${L('Usage-limit programme','使用限制組')}</span><span><i class="dot green"></i>${L('Usual use','通常使用組')}</span></div><svg class="chart" viewBox="0 0 520 250" role="img" aria-label="${L('S3 group means over 14 days on a zero to twenty-one scale','S3 兩組在14天內的均值，縱軸0至21')}"><title>Synthetic group means and ±1 standard error. Baseline 9.5 / 9.4; day 7 7.9 / 9.1; day 14 6.9 / 8.8.</title>${[0,7,14,21].map(v=>`<line x1="55" x2="470" y1="${y(v)}" y2="${y(v)}" class="grid-line"/><text x="40" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}<text x="55" y="24">${L('Symptoms · 0–21, lower is better','症狀 · 0–21，越低越好')}</text>${(P().flow?.trajectory||C.trajectory).groups.map((g,j)=>`<polyline points="${g.values.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${colors[j]}" stroke-width="2.8"/>${g.values.map((v,i)=>`<g data-act="trajectory:${j}:${i}" tabindex="0" role="button" aria-label="${esc(T(g.label))}, day ${C.trajectory.days[i]}, mean ${v}, standard error ${g.se[i]}"><line x1="${x(i)}" x2="${x(i)}" y1="${y(v-g.se[i])}" y2="${y(v+g.se[i])}" stroke="${colors[j]}"/><circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="white" stroke="${colors[j]}" stroke-width="2.5"/><text x="${x(i)}" y="${y(v)+(j?-14:23)}" text-anchor="middle" class="chart-num">${v.toFixed(1)}</text></g>`).join('')}`).join('')}${C.trajectory.days.map((d,i)=>`<text x="${x(i)}" y="235" text-anchor="middle">${L('Day','第')} ${d}${L('',' 天')}</text>`).join('')}</svg>`;}
function matrix(){const p=P();if(!p.claims.length)return `<div class="empty">${L('Mark a claim in the studio to start your evidence map.','在工作台標記主張，開始建立證據圖。')}</div>`;const rel={support:['+','Support','支持'],limit:['~','Limits','限制'],counter:['−','Challenges','反證／挑戰']};return `<div class="table-scroll"><table class="matrix"><thead><tr><th>${L('Claim / material','主張 / 材料')}</th>${p.sources.map(s=>`<th><button class="text-button" data-act="source:${s.id}">${esc(s.id)}</button></th>`).join('')}</tr></thead><tbody>${p.claims.map(c=>`<tr><td>${esc(T(c.label))}</td>${p.sources.map(s=>{const r=c.relations[s.id],a=rel[r];return `<td><button class="cell ${r||''}" data-act="relation:${c.id}:${s.id}" aria-label="${esc(T(c.label))} · ${s.id} · ${a?L(a[1],a[2]):L('Unlinked','未關聯')}">${a?L(a[1],a[2]):L('Not linked','尚未關聯')}</button></td>`;}).join('')}</tr>`).join('')}</tbody></table></div><div class="legend"><span><i class="key" style="background:#bcded3"></i>${L('Supports','支持')}</span><span><i class="key" style="background:#ecd8a4"></i>${L('Limits scope','限定範圍')}</span><span><i class="key" style="background:#dcb7c7"></i>${L('Challenges','挑戰主張')}</span><span>${L('Click a cell to inspect','點擊單元格核對')}</span></div>`;}
function progressData(){if(demo())return [{label:L('Initial draft','初稿'),counts:[8,0,0]},{label:L('Judgements','判斷記錄'),counts:[0,8,0]},{label:L('Revised draft','修訂稿'),counts:[0,0,8]}];const p=P();const count=()=>{let a=0,b=0,c=0;for(const f of p.comments){if(!p.decisions[f.id])a++;else if(p.versions.some(v=>JSON.stringify(v.decisions[f.id])===JSON.stringify(p.decisions[f.id])))c++;else b++;}return [a,b,c];};return [{label:L('Current records','當前記錄'),counts:count()}];}
function progressChart(){const rows=progressData(),colors=['#ded5ed','#ac91d5','#7151b9'];return `<div class="legend"><span><i class="dot gray"></i>${L('Awaiting a decision','待判斷')}</span><span><i class="dot" style="background:#ac91d5"></i>${L('Decision recorded','已記錄決定')}</span><span><i class="dot"></i>${L('Included in saved revision','已納入修訂記錄')}</span></div><svg class="chart" viewBox="0 0 520 205" role="img" aria-label="${L('Counts of feedback records by process state','按處理狀態統計批註記錄')}"><title>${demo()?'Illustrative progression, not learner results':'Current task records, not resolution or ability'}</title>${[0,2,4,6,8].map(v=>`<line x1="${130+v*43}" x2="${130+v*43}" y1="10" y2="163" class="grid-line"/><text x="${130+v*43}" y="185" text-anchor="middle">${v}</text>`).join('')}${rows.map((r,i)=>{let offset=0;return `<text x="0" y="${42+i*51}">${r.label}</text>`+r.counts.map((n,j)=>{const x=130+offset*43;offset+=n;return n?`<g data-act="process:${j}:${i}" tabindex="0" role="button" aria-label="${r.label}: ${n} ${['pending','decided','revision records'][j]}"><rect x="${x}" y="${24+i*51}" width="${n*43}" height="28" rx="4" fill="${colors[j]}"/><text x="${x+n*21.5}" y="${43+i*51}" text-anchor="middle" style="fill:${j?'white':'#75638c'}">${n}</text></g>`:'';}).join('')}).join('')}</svg>`;}
function forestPanel(){return panel('What do the trials estimate?','兩項試驗究竟估計了什麼？',L('Common units. Different interventions and endpoints.','單位相同，干預與終點不同。'),forest(),L('01 / EFFECTS','01 / 效應'),`<span>${L('Synthetic data · 95% CI · no pooled effect','合成資料 · 95% 置信區間 · 不合並效應')}</span>${btn('View data ↗','查看資料 ↗','forest-data','text-button')}`);}
function trajectoryPanel(){return panel('A decline is not the treatment effect','組內下降並不等於干預效果',L('S3 · n = 60 per group · means ± 1 SE','S3 · 每組 n = 60 · 均值 ± 1 標準誤'),lineChart(),L('02 / CHANGE','02 / 變化'),`<span>${L('Synthetic summary data · full 0–21 scale','合成彙總資料 · 完整 0–21 量表')}</span>${btn('Compare changes ↗','比較變化 ↗','trajectory-data','text-button')}`);}
function matrixPanel(){return panel('Which evidence supports this claim?','哪些證據支持這個觀點？',L('Read supporting and limiting evidence together.','同時查看支持、限定與相反證據。'),matrix(),L('03 / COVERAGE','03 / 覆蓋'),`<span>${demo()||P().kind==='practice'?L('Authored starting map · inspect or revise in practice','預寫起始圖 · 可在練習中核對修改'):L('Your manual links','你的手動關聯')}</span>${btn('Read the claims ↗','查看主張 ↗','view:studio','text-button')}`);}
function progressPanel(){return panel('From a comment to a reasoned revision','從批註到有依據的修訂',demo()?L('An illustrative record of the complete example.','完整示範的預寫過程記錄。'):L('Calculated from this project’s actual saved records.','根據當前專案實際儲存記錄計算。'),progressChart(),L('04 / PROCESS','04 / 過程'),`<span>${L('Recorded ≠ resolved · no ability score','已記錄 ≠ 已解決 · 不作能力評分')}</span>${btn('Inspect records ↗','查看記錄 ↗','view:history','text-button')}`);}
function overview(){return `${head('ARGUPATH / RESEARCH OVERVIEW','Make evidence part of every argument.','讓每項論證，都能回到證據。',L('A research writing studio for literature synthesis and discussion — from conflicting findings to a defensible conclusion.','面向文獻綜合與討論寫作：理解研究分歧，形成可以論證的結論。'),btn('Open writing studio →','打開寫作工作台 →','view:studio','primary'))}${modeStrip()}${metrics()}${P().kind==='personal'?`<div class="callout"><div><h2>${L('Build your research discussion.','開始構建論文討論。')}</h2><p>${L('Add your sources, write a paragraph and link a claim. The synthetic research charts belong to the separate teaching case.','添加材料、撰寫段落並關聯主張。合成研究圖表屬於獨立教學案例。')}</p>${btn('Add a source','添加材料','add-source')}</div><div class="grid2">${matrixPanel()}${progressPanel()}</div>`:`<div class="grid2">${forestPanel()}${trajectoryPanel()}</div><div class="grid2">${matrixPanel()}${progressPanel()}</div>`}<div class="callout"><div><h2>${L('A better discussion starts with a better comparison.','好的討論，始於有意義的比較。')}</h2><p>${L('Six materials. Five connected paragraphs. Eight feedback decisions — including a suggestion worth challenging.','六份材料，五段完整討論，八項回饋判斷，其中包含值得質疑的建議。')}</p>${btn('Explore the case','探索完整案例','guide')}</div><p class="footer-note">${L('Research case: synthetic teaching materials, not real study results. Target: senior undergraduate and novice postgraduate research writers.','研究案例為合成教學材料，非真實研究結果。面向高年級本科生與初次進行研究寫作的研究生。')}</p>`;}
function insights(){return `${head('EVIDENCE / INTERPRETATION','Look beyond the headline result.','從資料讀出結論的邊界。',L('Every chart links to its underlying material or saved record.','每張圖都能回到對應材料或已儲存記錄。'),btn('Export case CSV','匯出案例資料 CSV','csv'))}${modeStrip()}${P().kind==='personal'?`<div class="grid2">${matrixPanel()}${progressPanel()}</div>`:`<div class="study-filter">${[['effects','Trial estimates','試驗效應'],['change','Group changes','組間變化'],['coverage','Evidence coverage','證據覆蓋'],['process','Revision process','修訂過程']].map(([id,en,zh])=>btn(en,zh,'chart-tab:'+id,chartTab===id?'active':'')).join('')}</div><div class="analysis-chart">${chartTab==='effects'?forestPanel():chartTab==='change'?trajectoryPanel():chartTab==='coverage'?matrixPanel():progressPanel()}</div>`}<section class="panel section-gap"><div class="panel-head"><div><h2>${L('Traceable writing statistics','可追溯的寫作統計')}</h2><p>${L('Each figure describes records, not the correctness of your argument.','數字描述記錄，不判斷論證是否正確。')}</p></div></div><div class="panel-body"><table class="data-table"><thead><tr><th>${L('Measure','指標')}</th><th>${L('Value','數值')}</th><th>${L('How it is counted','統計口徑')}</th></tr></thead><tbody>${[[L('Claims with limiting / challenging evidence','存在限定或相反證據的主張'),P().claims.filter(c=>Object.values(c.relations).some(r=>r!=='support')).length,L('At least one manually assigned limit or challenge relation','至少存在一項手動指定的限定或挑戰關係')],[L('Comments whose paragraph changed','對應段落已變化的批註'),demo()?0:C.stats(P()).stale,L('Compared with the authored original paragraph; requires manual review','與預寫初稿的對應段落比較，需人工複覈')],[L('Reasons recorded','已記錄判斷理由'),C.stats(P()).decided,L('Nonempty saved reasons; no automatic quality judgement','已儲存的非空理由，不自動判斷質量')],[L('Transfer attempts','遷移回答次數'),P().transfer.length,L('Saved responses; help status stored per attempt','儲存作答次數，每次保留求助狀態')],[L('Current draft words','當前稿件詞數'),C.stats(P()).words,L('English word tokens; not a learning score','英文詞項計數，不是學習得分')]].map(r=>`<tr><td>${r[0]}</td><td><strong>${r[1]}</strong></td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></section>`;}
function evidence(){const sources=P().sources.filter(s=>(sourceFilter==='all'||sourceFilter==='trial'&&s.effect!==undefined||sourceFilter==='other'&&s.effect===undefined)&&(!sourceSearch||(T(s.title)+' '+s.id+' '+s.quote).toLowerCase().includes(sourceSearch.toLowerCase())));return `${head('SOURCES / RESEARCH MATERIALS','Read the study behind the sentence.','讀懂句子背後的研究。',L('Compare design, measurement, findings and limitations before you write.','動筆前，比較研究設計、測量、發現與侷限。'),btn('Add a source','添加材料',demo()?'practice':'add-source','primary'))}${modeStrip()}<div class="study-filter">${btn('All materials','全部材料','filter:all',sourceFilter==='all'?'active':'')}${btn('Trials','干預試驗','filter:trial',sourceFilter==='trial'?'active':'')}${btn('Other designs','其他設計','filter:other',sourceFilter==='other'?'active':'')}<input id="source-search" class="field source-search" value="${esc(sourceSearch)}" placeholder="${L('Search titles or excerpts','搜索標題或摘錄')}" aria-label="${L('Search materials','搜索材料')}">${btn('Search','搜索','search','tiny-button')}</div><div class="studies">${sources.map(s=>`<button class="study-card" data-act="source:${s.id}"><div class="study-code"><span>${esc(s.id)}</span><span>${esc(T(s.design))}</span></div><h3>${esc(T(s.title))}</h3><p>${esc(T(s.measure))}</p><div class="study-result">${esc(T(s.result))||L('Your source','你的材料')}</div><p>${esc(T(s.finding))}</p><footer><span>${s.n?'n = '+s.n:L('Custom material','自定義材料')}</span><span>${esc(T(s.duration))}</span><span>↗</span></footer></button>`).join('')||`<div class="empty">${L('No materials match. Add a source or clear the search.','沒有匹配材料，可添加材料或清除搜索。')}</div>`}</div><p class="footer-note">${L('S1–S6 are synthetic material IDs, not real citations. No authors or DOIs are invented.','S1–S6 是合成材料編號，不是真實文獻引用。未編造作者或 DOI。')}</p>`;}
function sourceBody(s){return `<span class="badge">${s.id.startsWith('S')?L('SYNTHETIC TEACHING MATERIAL','合成教學材料'):L('USER-SUPPLIED MATERIAL','用戶提供材料')}</span><h2 style="margin-top:16px">${esc(T(s.title))}</h2><div class="source-facts"><span>${esc(T(s.design))}</span><span>${s.n?'n = '+s.n:L('Sample not specified','未指定樣本')}</span><span>${esc(T(s.duration))}</span></div><div class="detail-grid">${[['Measure','測量',s.measure],['Estimate','估計',s.result],['Finding','發現',s.finding],['Limitations','侷限',s.limit]].map(([en,zh,v])=>`<div><small>${L(en,zh)}</small><p>${esc(T(v))||'—'}</p></div>`).join('')}</div><h3>${L('Source excerpt','材料原文')} · ${esc(s.section||'')}</h3><div class="source-excerpt">${esc(s.quote)}</div><div class="insight">${esc(T(s.role))}</div><p class="notice">${L('The excerpt remains in its supplied language when the interface switches.','切換界面語言時，材料原文保持原語言。')}</p>${btn('Find related comments','查找相關批註','source-feedback:'+s.id,'primary')}`;}
function annotated(p,i){let text=p.text;const fs=P().comments.filter(f=>f.p===i).map(f=>({...f,start:text.indexOf(f.quote)})).filter(f=>f.start>=0).sort((a,b)=>a.start-b.start);let cursor=0,out='';for(const f of fs){if(f.start<cursor)continue;out+=esc(text.slice(cursor,f.start))+`<button class="anchor ${focus===f.id?'selected':''}" data-act="focus:${f.id}" aria-label="${L('Review: ','查看批註：')+esc(T(f.title))}">${esc(f.quote)}</button>`;cursor=f.start+f.quote.length;}return out+esc(text.slice(cursor));}
function studio(){const p=P(),ps=demo()&&sampleVersion==='revised'?C.revised:p.draft;return `<div class="work-toolbar"><div><h2>${L('Literature synthesis & discussion','文獻綜合與討論')}</h2><small>${demo()?L('Complete example · read and explore','完整示範 · 閱讀與探索'):L('Your copy · edits save on this device','你的工作稿 · 編輯儲存到本機')} · ${(C.textOf(ps).match(/\b[\w]+(?:[-’'][\w]+)*\b/g)||[]).length} ${L('words','詞')}</small></div><div class="toolbar-choices">${demo()?`${btn('Initial draft','初稿','sample:original',sampleVersion==='original'?'active':'')}${btn('Revised example','修訂範例','sample:revised',sampleVersion==='revised'?'active':'')}${btn('Make a practice copy','創建練習副本','practice','primary')}`:`${btn('Read & review','閱讀與批註','paper:annotated',paperMode==='annotated'?'active':'')}${btn('Edit draft','編輯稿件','paper:edit',paperMode==='edit'?'active':'')}${p.kind==='practice'?btn('Preview example revision','預覽示例修訂','v11:revision','tiny-button'):''}${btn('Save revision','儲存修訂','save-version','primary')}`}${btn('Brief','寫作簡報','brief','tiny-button')}</div></div><div class="studio"><div class="paper-wrap"><article class="paper"><div class="paper-kicker">${L('RESEARCH DISCUSSION / WORKING PAPER','研究討論 / 工作稿')}</div><h1>${p.kind==='personal'?esc(p.title):L('Social media and anxiety:<br>making sense of conflicting evidence','社交媒體與焦慮：<br>如何理解相互分歧的證據')}</h1><div class="paper-meta">${p.kind==='personal'?L('Personal research discussion · user-supplied materials','個人研究討論 · 用戶提供材料'):L('Evidence synthesis & discussion · Teaching corpus S1–S6','證據綜合與討論 · 教學材料 S1–S6')}<br>${p.kind==='personal'?L('Write and link evidence in your own words.','用自己的文字寫作並關聯證據。'):demo()&&sampleVersion==='revised'?L('Revised example · prewritten, not automatically generated','修訂範例 · 預先編寫，非自動生成'):L('Initial draft contains deliberately debatable interpretations.','初稿刻意保留值得討論的解釋。')}${p.kind==='personal'?'<br>'+L('Your personal text and materials remain separate from the teaching case.','個人文本與材料和教學案例獨立。'):''}</div>${ps.map((para,i)=>`<section class="paragraph" id="paragraph-${i}"><h3><span>${String(i+1).padStart(2,'0')} / ${esc(T(para.title))}</span>${!demo()?btn('Mark a claim','標記主張','claim:'+i,'text-button'):''}</h3>${!demo()&&paperMode==='edit'?`<label class="hidden" for="editor-${i}">${esc(T(para.title))}</label><textarea id="editor-${i}" data-paragraph="${i}" aria-label="${esc(T(para.title))}">${esc(para.text)}</textarea>`:`<p>${demo()&&sampleVersion==='revised'?esc(para.text):annotated(para,i)}</p>`}</section>`).join('')}${p.kind==='personal'?btn('Add paragraph','添加段落','add-paragraph','tiny-button'):''}<div class="paper-meta" style="border-top:1px solid var(--line);padding-top:15px;border-bottom:0;margin:25px 0 0">${p.kind==='personal'?L('Source links and notes are manually supplied and require verification.','材料關聯與筆記由用戶手動提供，需要覈查。'):L('Material IDs in brackets / text refer to the synthetic teaching corpus. This is a discussion excerpt, not a complete paper or a systematic review.','文中材料編號指向合成教學材料。這是討論小節，並非完整論文或系統綜述。')}</div></article></div><aside class="review-panel"><div class="review-top"><h2>${L('Research companion','寫作側欄')}</h2><span class="badge">${demo()?L('Authored example','預寫示範'):L('Your decisions','你的判斷')}</span></div><div class="toolbar-choices" style="margin-bottom:18px">${btn('Feedback','回饋','review:feedback',reviewTab==='feedback'?'active':'')}${btn('Evidence','材料','review:evidence',reviewTab==='evidence'?'active':'')}${btn('Data','資料','review:data',reviewTab==='data'?'active':'')}</div>${reviewTab==='feedback'?feedbackPanel():reviewTab==='evidence'?evidencePanel():dataPanel()}</aside></div>`;}
function feedbackPanel(){const p=P(),f=p.comments.find(f=>f.id===focus)||p.comments[0];if(!f)return `<div class="insight">${L('Personal projects support manual writing and evidence links. Automatic feedback is not connected in this workspace. Use the complete case to explore authored feedback.','個人專案支持手動寫作與證據關聯，此工作台尚未接通自動回饋。可在完整案例查看預寫回饋。')}</div>${btn('Open complete example','打開完整示範','demo','primary section-gap')}`;const d=p.decisions[f.id],dd=p.decisionDrafts?.[f.id]||d,h=p.hints[f.id]||[];return `${demo()&&sampleVersion==='revised'?`<div class="insight">${L('These comments refer to the initial draft. Switch to Initial draft to inspect their exact anchors.','這些批註對應初稿。切換到初稿可查看準確定位。')}</div>`:''}<div class="feedback-list">${p.comments.map((c,i)=>`<button class="${c.id===f.id?'active':''}" data-act="focus:${c.id}" aria-label="${L('Comment','批註')} ${i+1}: ${esc(T(c.title))}">${i+1}${p.decisions[c.id]?' ·':''}</button>`).join('')}</div><span class="badge gray">${esc(T(f.type))}</span><h3 style="margin-top:12px">${esc(T(f.title))}</h3><div class="quote">${esc(f.quote)}</div>${!demo()&&C.stale(p,f)?`<div class="warning">${L('The paragraph has changed. This comment refers to the original snapshot and requires review. No new analysis has run.','該段落已改變。此批註來自初稿，需複覈；尚未執行新分析。')}</div>`:''}<p>${esc(T(f.explain))}</p><div class="source-chips">${f.sources.map(id=>btn('↗ '+id,'↗ '+id,'source:'+id)).join('')}</div><p class="feedback-question">${esc(T(f.question))}</p><div class="row">${btn('Hint 1','一級提示','hint:'+f.id+':1','tiny-button')}${btn('Hint 2','二級提示','hint:'+f.id+':2','tiny-button')}</div>${[1,2].filter(n=>h.includes(n)).map(n=>`<div class="hint"><strong>${L('Hint','提示')} ${n}</strong>${esc(T(f.hints[n-1]))}</div>`).join('')}<label class="field-label">${L('Your judgement','你的判斷')}</label>${demo()?`<span class="badge green">${choices()[d.choice]}</span><p class="hint" style="margin-top:12px">${esc(d.reason)}</p><p class="notice">${L('This is a prewritten model decision. Other positions may be defensible with evidence.','這是預寫判斷範例；其他有依據的立場也可能合理。')}</p>${btn('Try your own judgement','嘗試自己的判斷','practice','primary full-width')}`:`<select id="decision-choice" class="field" aria-label="${L('Your judgement','你的判斷')}">${Object.entries(choices()).map(([v,label])=>`<option value="${v}" ${dd?.choice===v?'selected':''}>${label}</option>`).join('')}</select><label class="field-label" for="decision-reason">${L('Why? Point to evidence or a limitation.','為什麼？請指出證據或侷限。')}</label><textarea class="field" id="decision-reason" data-draft-reason="${f.id}">${esc(p.decisionDrafts?.[f.id]?.reason??d?.reason??'')}</textarea><div class="row" style="margin-top:10px">${btn(d?'Update decision':'Record decision',d?'更新判斷':'記錄判斷','decision:'+f.id,'primary')}${btn('View example','查看範例','example:'+f.id,'tiny-button')}</div>${d?`<p class="notice">${L('Saved with this comment. This does not certify resolution.','已與本條批註儲存；不代表問題已解決。')}</p>`:''}`}<p class="notice">${L('Authored teaching feedback, not live AI. One blanket causal-language suggestion is deliberately flawed; another remedy is overbroad.','預寫教學回饋，非即時 AI。包含一條故意錯誤的因果措辭建議，以及一項過度的修改建議。')}</p>`;}
function evidencePanel(){const s=P().sources.find(s=>s.id===selectedSource)||P().sources[0];return `<div class="source-chips">${P().sources.map(s=>btn(s.id,s.id,'side-source:'+s.id)).join('')}</div>${s?sourceBody(s):`<div class="empty">${L('Add your first source.','請添加第一份材料。')}</div>`}`;}
function dataPanel(){if(P().kind==='personal')return `<p>${L('Teaching-study data are kept in the complete example. Your own sources are not assigned invented statistics.','教學研究資料保留在完整示範中，不為你的材料編造統計值。')}</p>${btn('Open your evidence map','打開證據圖','view:insights','primary')}`;return `<h3>${L('Two groups, two changes','兩組，各有變化')}</h3>${lineChart()}<div class="insight">${L('Intervention: −2.6<br>Control: −0.6<br>Difference in changes: −2.0 points.<br>This descriptive comparison is not a newly fitted model.','干預組：−2.6<br>對照組：−0.6<br>變化差：−2.0 分。<br>此為描述性比較，並非新擬合模型。')}</div><div class="section-gap">${btn('Open all four charts →','打開全部四張圖 →','view:insights','primary full-width')}</div>`;}
function history(){const p=P();let versions=demo()?[{id:'Initial',text:C.textOf(C.draft),reason:L('Initial draft supplied for critique.','供批判閱讀的初稿。'),decisions:{}},{id:'Revised',text:C.textOf(C.revised),reason:L('Reorganised the synthesis by design and exposure; retained S3’s bounded causal statement; corrected uncertainty, treatment contrast and mediation claims; replaced a universal restriction with an evaluable proposal.','按研究設計與暴露變量重組綜合，保留 S3 的有限因果陳述，糾正不確定性、干預對照與中介論斷，將普遍限制改為需評估的提議。'),decisions:p.decisions}]:p.versions;return `${head('REVISION / REASONING TRAIL','See what changed. Understand why.','看見修改，也看見依據。',L('Keep the original, the judgement and the revision in the same record.','將原文、判斷與修訂保留在同一份記錄中。'),btn('Back to the studio','返回工作台','view:studio','primary'))}${modeStrip()}${versions.length?`<div class="history-reason"><strong>${L('Revision rationale','修訂理由')}</strong><br>${esc(versions.at(-1).reason)}</div><div class="history-columns"><section class="history-col"><h3>${L('Original teaching draft / baseline','教學初稿 / 基線版本')}</h3><div class="history-text">${esc(p.kind==='personal'?versions[0].text:C.textOf(C.draft))}</div></section><section class="history-col"><h3>${L('Latest saved version','最近儲存版本')} · ${esc(versions.at(-1).id)}</h3><div class="history-text">${esc(versions.at(-1).text)}</div></section></div>`:`<section class="panel empty"><h2>${L('Your original is ready. Save your first revision.','初稿已就緒，儲存你的首次修訂。')}</h2><p>${L('Edit the draft in the studio, then save it with a reason.','在工作台編輯稿件，再附上理由儲存。')}</p>${btn('Start revising','開始修訂','edit','primary')}</section>`}<section class="panel section-gap"><div class="panel-head"><div><h2>${L('Current feedback decisions','當前回饋判斷')}</h2><p>${L('Current reasons. Each saved snapshot separately preserves the decisions at that time.','此處為當前理由；每份儲存版本記錄另行保留當時的判斷。')}</p></div></div><div class="panel-body">${p.comments.filter(f=>p.decisions[f.id]).map(f=>`<div class="activity-row"><span class="badge">${choices()[p.decisions[f.id].choice]}</span><div><p><strong>${esc(T(f.title))}</strong></p><p>${esc(p.decisions[f.id].reason)}</p><small>${f.sources.join(' · ')}</small></div>${btn('Open','查看','focus:'+f.id,'tiny-button')}</div>`).join('')||`<p class="muted">${L('No decisions recorded yet.','尚未記錄判斷。')}</p>`}</div></section>${!demo()&&versions.length?`<section class="panel section-gap"><div class="panel-head"><h2>${L('Saved snapshots','儲存的版本記錄')}</h2></div><div class="panel-body">${versions.map((v,i)=>`<details><summary>${esc(v.id)} · ${esc(new Date(v.createdAt).toLocaleString())}</summary><p>${esc(v.reason)}</p><div class="history-text">${esc(v.text)}</div><p>${L('Judgements captured at save:','儲存時記錄的判斷：')} ${Object.keys(v.decisions).length}</p></details>`).join('')}</div></section>`:''}`;}
const transferText={a:'T1: In a voluntary study of 340 students, AI planning-tool users had higher course marks. Baseline achievement and motivation were not adequately controlled. Association: standardised β = 0.18 [0.05, 0.31].',b:'T2: In a randomised six-week trial of tool access plus orientation versus usual planning (n = 160), the adjusted difference in assessment scores was +3.1 points [0.4, 5.8] on a 0–100 scale. Assume reliable allocation, complete follow-up and common assessment. The trial does not isolate tool access from orientation, establish benefit for everyone or measure later performance.',answer:'T1 is vulnerable to self-selection and does not establish a causal effect. T2 supports a bounded average effect of assignment to the combined programme under its assumptions, not a guarantee for every student or an isolated effect of the tool. The interval indicates uncertainty about effect size; practical importance requires context. A further study could separate tool access and orientation and assess persistence.'};
function transfer(){const p=P();return `${head('TRANSFER / A NEW RESEARCH QUESTION','Try the same reasoning with a new topic.','換個題目，你會如何判斷？',L('Apply the distinctions to a different literature discussion.','換一組研究材料，試試如何判斷研究設計、結論範圍與不確定性。'))}${modeStrip()}<div class="callout"><div><h2>${L('Do AI planning tools improve academic performance?','AI 學習計劃工具能提高學業表現嗎？')}</h2><p>${L('Critique: “The evidence proves that the tool itself raises every student’s grades.”','待評估：“證據證明，工具本身能提高每位學生的成績。”')}</p></div></div><div class="grid2">${[transferText.a,transferText.b].map((t,i)=>`<div class="panel" style="padding:24px"><span class="badge">T${i+1} · ${L('Synthetic material','合成材料')}</span><p style="margin-top:18px">${t}</p></div>`).join('')}</div><section class="panel" style="padding:25px"><h2>${L('Explain, qualify, propose','解釋、限定、提出問題')}</h2><p class="muted">${L('What does each design establish? Rewrite the claim, then specify one research gap grounded in these materials.','每種設計支持什麼？重寫主張，並從材料中提出一項具體研究空缺。')}</p>${demo()?`<div class="source-excerpt">${transferText.answer}</div><p class="notice">${L('Prewritten transfer example. Try a practice copy before viewing this answer if you want an independent attempt.','預寫遷移範例。如果要獨立作答，請先創建練習副本再查看答案。')}</p>${btn('Try the practice copy','進入練習副本','practice','primary')}`:`<label class="field-label" for="transfer-answer">${L('Your analysis and revised claim','你的分析與修訂主張')}</label><textarea id="transfer-answer" class="field" style="min-height:180px">${esc(p.transferDraft||'')}</textarea><div class="row section-gap">${btn('Save response','儲存作答','save-transfer','primary')}${btn('Need a hint','需要提示','transfer-hint','tiny-button')}${btn('View worked reasoning','查看推理範例','transfer-example','tiny-button')}</div>${p.transferHelp?`<div class="hint">${L('Separate selection from assignment, a combined programme from the tool alone, and an average effect from a guarantee.','區分自我選擇與隨機分配、組合方案與工具本身、平均效果與個體保證。')}</div>`:''}`}</section>${p.transfer.length?`<section class="panel section-gap" style="padding:24px"><h2>${L('Preserved attempts','保留的作答')}</h2>${p.transfer.map((a,i)=>`<details><summary>${i+1} · ${a.help?L('After in-app help','查看提示之後'):L('Before in-app help','查看提示之前')}</summary><p>${esc(a.answer)}</p></details>`).join('')}</section>`:''}<p class="footer-note">${L('No automatic mastery judgement. “Before help” refers only to help inside this application.','不自動判定掌握。“求助前”僅指尚未查看本應用內幫助。')}</p>`;}
function guide(){modal('The complete research-writing case','完整研究寫作劇本',`<span class="badge">${L('12–18 MINUTE WALKTHROUGH','12–18 分鐘體驗')}</span><p>${L('Audience: senior undergraduate and novice postgraduate writers preparing their first research-based paper. This is a literature-synthesis and discussion section, not a grammar drill.','面向準備第一篇研究型論文的高年級本科生與研究生。本案例聚焦文獻綜合與討論，不是語法練習。')}</p><div class="onboarding-list">${[
['Compare before concluding','先比較，再下結論','Start with the effect and trajectory charts. Notice why a within-group decline is not the treatment contrast, and why intervals crossing zero do not prove no effect.','從效應圖和變化圖開始，理解組內下降為何不等於干預對照，以及區間跨零為何不代表證明無效應。'],
['Read six different kinds of evidence','閱讀六份不同設計的證據','S1 and S2 address association and time; S3/S4 test distinct interventions; S5 differentiates use types; S6 adds context without proving mediation.','S1、S2 提供關聯與時間線索；S3、S4 檢驗不同干預；S5 區分使用方式；S6 提供情境而非證明中介。'],
['Inspect a full discussion draft','檢查完整討論初稿','Open the studio. Five connected paragraphs contain eight debatable interpretations. Click highlighted sentences to inspect the relevant comments and sources.','打開工作台，五段連貫討論包含八項值得檢查的解釋。點擊高亮句查看批註與材料。'],
